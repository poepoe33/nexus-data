name: carpark-reference

# 每天抓一次每個停車場的「總車位數 / 地址 / 電話 / 收費」等靜態資料
# 這些資料很少變動，所以不需要跟著 30 分鐘的快照跑（會多打 91 次請求）
# 04:00 澳門時間 = 20:00 UTC（前一天）
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# ⚠️ 這裡是 true，不是 false —— 跟 scrape.yml 同一個理由。
#
# `cancel-in-progress: false` 的意思是「排隊等」，但**排隊等一個永遠不結束的 run
# 就是永久死鎖**：只要有一班卡住（例如 job 拿不到 runner、`steps: []`），
# 這個 group 就永遠不放，之後每天的排程都只會 pending、再被下一班取消，
# 而且**不會自己好**（timeout-minutes 也救不了「從沒開始」的 job）。
# 2026-10-05 的 29 小時停擺就是這個形狀。
#
# 這支是**每天一次**的靜態資料更新，一班正常幾十秒 ——
# 新的一班取消舊的一班的機率幾乎是零，所以 true 沒有實際代價。
concurrency:
  group: carpark-reference
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh carpark master data
        run: python3 scripts/scrape.py reference --root . --delay 0.5

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add -A data
          if git diff --cached --quiet; then
            echo "no data change, skip commit"
            exit 0
          fi
          git commit -m "chore(data): refresh carpark master data $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push failed, retry $i"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
