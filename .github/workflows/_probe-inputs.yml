name: probe-inputs

# ⚠️ 這是一個**暫時的**實驗檔，用來回答一個問題：
#   workflow_dispatch 的 API 若帶一個「沒有寫在 workflow 檔的 inputs:」，
#   GitHub 會 (a) 拒絕、還是 (b) 接受並放進 GITHUB_EVENT_PATH 的 payload？
#
# 為什麼要問這個：我們想在 admin 頁面分辨「誰觸發了這次採集」
#   （GitHub 自己的 schedule / Google Apps Script / 本機 Mac watchdog）。
#   如果 (b) 成立，scrape.py 只要讀 GITHUB_EVENT_PATH 就能拿到來源標記，
#   **完全不必改 .github/workflows/scrape.yml** —— 而那個檔案開頭有一條
#   「改它會讓 GitHub 重新註冊排程」的警告，能不動最好。
#
# 實驗做完就刪掉這個檔案。

# 實驗結果（2026-10-02）：
#   ① 帶「未宣告」的 inputs → **HTTP 422**
#      {"message":"Unexpected inputs provided: [\"origin\"]"}
#      → GitHub 會**拒絕**沒寫在 workflow 檔裡的 input。
#        「偷偷塞一個 origin 進去、不必改 workflow」這條路是**不通的**。
#   ② 所以來源標記**必須**先宣告在 workflow 檔裡。
#      下面的 inputs: 就是用來確認「宣告之後就送得進去」。

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "誰觸發的（apps-script / mac-watchdog / manual）"
        required: false
        default: "unspecified"
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the event payload GitHub actually delivered
        run: |
          echo "=== GITHUB_EVENT_NAME = $GITHUB_EVENT_NAME ==="
          echo "=== top-level keys of GITHUB_EVENT_PATH ==="
          jq -r 'keys[]' "$GITHUB_EVENT_PATH"
          echo "=== .inputs (the answer we care about) ==="
          jq -c '.inputs // "ABSENT"' "$GITHUB_EVENT_PATH"
          echo "=== .inputs.origin ==="
          jq -r '.inputs.origin // "ABSENT"' "$GITHUB_EVENT_PATH"
          echo "=== full payload (truncated to 2000 chars) ==="
          head -c 2000 "$GITHUB_EVENT_PATH"
