name: carpark-snapshot

# 每 30 分鐘抓取一次澳門 DSAT 公共停車場實時剩餘車位
# cron 使用 UTC；UTC 的 :00 / :30 對應澳門時間 (UTC+8) 的 08:00 / 08:30 ...
on:
  # 為什麼是 7,37 而不是 */30 或 0,30：
  # GitHub 官方文件明講 schedule 是 best-effort，而且「整點（:00）負載最高，
  # 最容易被延遲或直接丟掉」。0 和 30 都踩在高負載點上，所以刻意錯開到 7 與 37。
  #
  # ⚠️ 每次改動這個檔案，GitHub 都會重新註冊排程，註冊要 15 分鐘到數小時不等，
  #    期間一次 schedule 都不會跑。改完就不要再動它。
  #    （2026-10-02 起這個代價已經很小：外部觸發器每 30 分鐘穩定供貨，
  #      schedule 只是額外的 4–5 次/天。但沒必要還是不動。）
  schedule:
    - cron: "7,37 * * * *"

  # `origin` 是「這次採集是誰觸發的」，用來讓 data/collections.csv 分得出
  # Google Apps Script / 本機 Mac watchdog / 人手 —— admin 頁面才有辦法顯示。
  #
  # ⚠️ 為什麼一定要**宣告**在這裡，不能偷偷在 API 帶：
  #    2026-10-02 實測，帶一個沒寫在這裡的 input 會直接被打回：
  #      HTTP 422 {"message":"Unexpected inputs provided: [\"origin\"]"}
  #    宣告之後才送得進來（實測 204，且 runner 的 GITHUB_EVENT_PATH 裡
  #    .inputs.origin 確實有值）。
  #
  # scrape.py 是讀 GITHUB_EVENT_PATH（runner 自動提供的環境變數），
  # 所以下面**不需要**在任何步驟加 `env:`。
  #
  # ⚠️ 這次改動會讓 GitHub 重新註冊上面的 schedule（見檔頭警告）。
  #    代價已經很小：外部觸發器（Apps Script）每 30 分鐘穩定供貨，
  #    schedule 只是額外的 4–5 次/天。
  workflow_dispatch:
    inputs:
      origin:
        description: "誰觸發的：apps-script / mac-watchdog / manual"
        required: false
        default: "unspecified"
        type: string

permissions:
  contents: write
  # 為什麼需要 pages / id-token：本 workflow 自己也要部署 Pages。
  # 因為用 GITHUB_TOKEN 推的 commit **不會觸發其他 workflow**
  # （GitHub 刻意防止遞迴），所以 pages.yml 永遠等不到這裡的 push，
  # 儀表板就會停在舊資料。與其想辦法繞，不如自己部署。
  pages: write
  id-token: write

concurrency:
  group: carpark-snapshot
  # ⚠️ 這裡是 true，不是 false —— 2026-10-05 的停擺事故換來的。
  #
  # 事發：某一班的 deploy job 卡在 queued 拿不到 runner（卡了 29 小時），
  # 整個 run 因此永遠不 completed。而 workflow 層級的 concurrency group
  # 是被「還沒完成的 run」握著的 —— 於是之後每一班都只能 pending，
  # 再被下一班取消。採集整整停擺 29 小時，而且**不會自己好**。
  #
  # cancel-in-progress: false 的意思是「排隊等」。但「排隊等一個永遠不結束的 run」
  # 就是永久死鎖。改成 true：新的一班直接取消舊的，最壞 30 分鐘內自己恢復。
  #
  # 代價：萬一某一班真的還在跑，會被下一班取消。但正常一班約 1~2 分鐘，
  # 觸發間隔 30 分鐘，撞上的機率極低 —— 而且「偶爾少一筆快照」
  # 遠好過「整條 pipeline 永久停擺且無人察覺」。
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 一定要在「採集之前」先同步。這樣工作區是乾淨的，git 不需要 --autostash，
      # 也就不會踩到 2026-09-28 那次事故：autostash 重新套用時衝突，
      # 錯誤被 `|| true` 吞掉，衝突標記就被 commit 進資料檔。
      - name: Sync with remote (clean tree)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

      # 進來就先自我修復：如果上一次留下壞資料，不要讓它卡住整條流程。
      - name: Guard data files (incoming)
        run: |
          if python3 scripts/data_guard.py --check; then
            exit 0
          fi
          echo "::warning::來源資料含衝突標記，自動修復"
          python3 scripts/data_guard.py --resolve

      - name: Collect snapshot
        id: collect
        run: python3 scripts/scrape.py snapshot --root .

      - name: Compress finished daily files
        run: python3 scripts/scrape.py housekeep --root .

      - name: Rebuild dashboard data
        env:
          # 高德地圖憑證（見 README「使用率地圖」）。
          # 沒設這兩個 Secret 也不會壞：build_map.py 會沿用既有 map.html 裡的憑證，
          # 只更新資料，不會把線上的地圖弄成空白。
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          AMAP_SECURITY: ${{ secrets.AMAP_SECURITY }}
        run: |
          python3 scripts/build_dashboard.py
          # 地圖是加值功能。萬一 data/carpark_coords.csv 缺失，也不要讓
          # 整條採集流程失敗 —— 採集與儀表板才是主線。
          python3 scripts/build_map.py || echo "::warning::build_map.py 失敗，本次略過地圖更新"

      # 守門員：絕對不 commit 帶衝突標記的資料。偵測到就自動修復再重建。
      - name: Guard data files (before commit)
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          AMAP_SECURITY: ${{ secrets.AMAP_SECURITY }}
        run: |
          if python3 scripts/data_guard.py --check; then
            exit 0
          fi
          echo "::warning::偵測到衝突標記，自動修復後重建 dashboard"
          python3 scripts/data_guard.py --resolve
          python3 scripts/build_dashboard.py
          python3 scripts/build_map.py || echo "::warning::build_map.py 失敗，本次略過地圖更新"
          python3 scripts/data_guard.py --check

      - name: Commit and push
        run: |
          set -e
          git add -A data dashboard
          if git diff --cached --quiet; then
            echo "no data change, skip commit"
            exit 0
          fi
          git commit -m "chore(data): carpark snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"

          # 此時工作區是乾淨的（改動都已 commit），所以不需要 --autostash，
          # 也就不會產生「Stashed changes」那種救不回來的衝突。
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push failed, retry $i"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; sleep 5; continue; }
            sleep 5
          done

          echo "::error::push 失敗 3 次，放棄。資料沒有遺失，下一班會再採。"
          exit 1

      # 只上傳「建置產物」。dashboard/ 裡還有 template.html / map_template.html /
      # admin_template.html 這三個原始模板（含 <!--DATA--> / <!--MAPDATA--> 佔位標記），
      # 直接上傳整個 dashboard/ 會把它們一起公開出去，所以先挑檔到 _site/。
      #
      # ⚠️ admin.html 一定要一起複製：每次部署都是「整個 _site 換掉」，
      #    少複製一個檔就等於把那個頁面從線上刪掉。這支 workflow 每 30 分鐘
      #    跑一次，漏掉的話 admin.html 會在幾分鐘內消失。
      - name: Stage Pages site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp dashboard/index.html _site/index.html
          if [ -f dashboard/map.html ]; then
            cp dashboard/map.html _site/map.html
          else
            echo "::warning::dashboard/map.html 不存在，本次不發布地圖"
          fi
          if [ -f dashboard/admin.html ]; then
            cp dashboard/admin.html _site/admin.html
          else
            echo "::warning::dashboard/admin.html 不存在，本次不發布管理頁面"
          fi
          ls -la _site

      # 一定要在 commit 之後才上傳 —— 這樣 artifact 裡的 dashboard/index.html
      # 才是剛重建好的那一版。
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # 部署獨立成一個 job：deploy-pages 需要 github-pages environment，
  # 而 environment 是 job 層級的設定。
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    # deploy-pages 若卡住又沒有 timeout，就會永遠掛著、把整個 run 拖住不 completed，
    # 進而鎖死 workflow 的 concurrency group（2026-10-05 那次卡了 29 小時）。
    # 跟 scrape 一樣給 10 分鐘。
    # ⚠️ 但要知道這道防線的極限：timeout-minutes 只在 job **開始跑之後**才計時。
    #    那次是根本沒拿到 runner（runner_name: null），所以這個 timeout 不會生效。
    #    真正兜底的是上面 workflow 層級的 cancel-in-progress: true。
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # 這個 `pages` group 現在**只有這裡在用**（自動部署的唯一出口）。
    #
    # ⚠️ 2026-10-07 之前它跟 pages.yml 共用 —— concurrency group 是 **repo 級**的，
    #    所以「這裡的 job 層級 pages」與「pages.yml 的 workflow 層級 pages」
    #    其實是**同一個 group**。pages.yml 只要有一個 run 卡住，那個 group 就永遠不放，
    #    這個 job 就會一直 `queued`、拿不到 runner、`steps: []` ——
    #    跟 2026-10-05 那次停擺的形狀一模一樣，而且**沒有任何 timeout 救得了它**。
    #    已經把 pages.yml 改成手動觸發並換成 `pages-manual` group，把這條路封掉。
    #
    #    現在的唯一持有者是自己，所以 workflow 層級的 `cancel-in-progress: true`
    #    就是完整兜底：卡住的那班會被下一班取消 → 這個 group 跟著釋放 → 下一班的
    #    deploy 拿得到。**所以這裡維持 false 是安全的**（別改成 true：
    #    部署被中途取消會留下一個半完成的 deployment）。
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
