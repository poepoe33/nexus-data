<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<!-- 淺色主題：瀏覽器 UI／狀態列也跟著用奶油綠，不要深色一條壓在上面 -->
<meta name="theme-color" content="#EAF2E6">
<!-- 「像 web app」的關鍵：加到主畫面後用全螢幕開啟，不要有 Safari 的網址列 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="澳門車位">
<meta name="format-detection" content="telephone=no">
<title>澳門停車場實時車位</title>
<style>
:root{
  /* 淺色澳門色調。刻意與 map.html 用同一組變數，兩頁觀感才會一致。 */
  --bg:#EAF2E6;                      /* 頁面底色：淺綠白 */
  --card:#FFFFFF;                    /* 卡片：純白。這頁資料密集，白底讀起來最清楚 */
  --card2:#EDF3E8;                   /* 次要區塊／hover */
  --line:#DCE6D4;                    /* 邊線：淺綠灰 */
  --tx:#1F3A2C;                      /* 主文字：深墨綠 */
  --tx2:#4B6A55;
  --tx3:#7C937F;
  --accent:#2E8B62;                  /* 澳門綠 */
  --accent-tx:#FFFFFF;
  --gold:#B07D0E;                    /* 澳門黃（白底上要夠深才看得清） */
  --ok:#1F7A46; --warn:#8A6A15; --bad:#C0392B;
  --track:#E4EDDF;                   /* 進度條／長條圖的底 */
  --shadow:0 4px 16px rgba(31,58,44,.10);
  color-scheme:light;
}
body.mode-motor{--accent:var(--gold)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
/* 底部留白要扣掉浮動地圖鈕（52px + 16px 邊距），否則最後一張卡片會被蓋住 */
.wrap{max-width:520px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom))}

/* header */
header{padding:calc(env(safe-area-inset-top,0px) + 22px) 0 12px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.3px}
.sub{margin-top:5px;font-size:12px;color:var(--tx3)}
/* 地圖入口：浮動按鈕固定在右下角，不佔頁面高度。
   原本是 header 裡的文字按鈕，但「切去地圖」是隨時都可能想做的動作，
   固定在視窗右下比塞在標題底下更好按，也不會把 header 撐高。
   z-index 刻意低於 .mask(40)：開詳細面板時它應該被遮住，不該浮在上面。 */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--accent-tx);text-decoration:none;z-index:30;
  box-shadow:0 6px 20px rgba(46,139,98,.40);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab:hover{filter:brightness(1.07)}
.sub b{color:var(--tx2);font-weight:500}

/* ---- 頂部兩大分類 ---- */
.modes{display:flex;gap:10px;margin:16px 0 6px}
.mbtn{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 10px 12px;cursor:pointer;text-align:center;transition:.18s;color:var(--tx2)
}
.mbtn:active{transform:scale(.985)}
.mbtn .ico{display:block;margin:0 auto 6px;color:var(--tx3)}
.mbtn .nm{font-size:15.5px;font-weight:600;color:var(--tx);letter-spacing:.3px}
.mbtn .ds{font-size:11px;color:var(--tx3);margin-top:3px}
.mbtn.on{border-color:transparent;color:var(--accent-tx)}
.mbtn.on .ico,.mbtn.on .ds{color:rgba(255,255,255,.82)}
.mbtn.on .nm{color:var(--accent-tx)}
#mb-car.on{background:linear-gradient(160deg,#3AA173,#25684A);box-shadow:0 4px 16px rgba(46,139,98,.28)}
#mb-motor.on{background:linear-gradient(160deg,#C79320,#8A6A15);box-shadow:0 4px 16px rgba(176,125,14,.28)}
.mhint{font-size:11px;color:var(--tx3);text-align:center;margin:0 0 4px}

/* overview */
.ov{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.ring{position:relative;width:96px;height:96px;flex:0 0 96px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:23px;font-weight:600;letter-spacing:-.5px}
.ring .val span{font-size:10px;color:var(--tx3);margin-top:1px}
.stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.stat{background:var(--card2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px}
.stat span{font-size:11px;color:var(--tx3)}

/* tabs */
.tabs{display:flex;gap:6px;margin:18px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{
  flex:1;border:0;background:transparent;color:var(--tx2);font:inherit;font-size:14px;font-weight:500;
  padding:9px 0;border-radius:9px;cursor:pointer;transition:.18s
}
.tabs button.on{background:var(--accent);color:var(--accent-tx);font-weight:600}

/* 圖卡內的分頁：刻意跟頁面層的 .tabs 用同一組視覺語言（同一個 accent、同樣的
   圓角膠囊），但縮小一號 —— 它是卡片裡的切換，不是頁面層級的切換。 */
.ctabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:3px;margin-bottom:10px}
.ctabs button{
  flex:1;border:0;background:transparent;color:var(--tx2);font:inherit;
  font-size:11.5px;font-weight:500;padding:6px 2px;border-radius:7px;cursor:pointer;
  transition:.18s;white-space:nowrap
}
.ctabs button.on{background:var(--accent);color:var(--accent-tx);font-weight:600}

/* search + sort */
.tools{display:flex;gap:8px;margin-bottom:12px}
input[type=search]{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;color:var(--tx);font:inherit;font-size:14px;outline:none
}
input[type=search]:focus{border-color:var(--accent)}
select{
  background:var(--card);border:1px solid var(--line);border-radius:11px;color:var(--tx2);
  font:inherit;font-size:13px;padding:10px 8px;outline:none
}

/* ---- 停車場卡片 ----
   改成「一格一停車場」的網格：手機 2 欄、平板 3 欄、桌機 4 欄。
   卡片縮小之後一頁能放更多，剩下的長度問題交給「載入更多」處理 ——
   而不是靠一直縮字級，那樣最後會變成沒人看得清楚。 */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.cp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
  cursor:pointer;transition:.15s;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:7px;min-width:0}
.cp:active{background:var(--card2)}
.cp .top{display:flex;align-items:flex-start;gap:5px;min-width:0}
/* 兩行截斷：停車場名稱長度差很多，不截斷的話同一列的卡片高度會被拉開 */
.cp .nm{font-size:12.5px;font-weight:500;flex:1;min-width:0;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cp .zn{font-size:9px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;
  padding:1px 4px;white-space:nowrap;flex:0 0 auto;margin-top:1px}
/* margin-top:auto 讓數字列沉到卡片底部，同一列不同高度的卡片才會對齊 */
.cp .mid{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto}
.cp .num{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.cp .num b{font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.3px}
.cp .rt{font-size:15px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.track{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}

/* ---- 每週高峰卡片：同一套網格，內容不同 ---- */
.pk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
  cursor:pointer;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);min-width:0}
.pk:active{background:var(--card2)}
.pk .n{font-size:12.5px;font-weight:500;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk .p{font-size:10px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .p b{font-weight:600}
.pk .r{margin-top:auto;display:flex;align-items:baseline;gap:4px}
.pk .r b{font-size:15px;font-weight:600;letter-spacing:-.3px}
.pk .r span{font-size:9.5px;color:var(--tx3)}

/* 「載入更多」：橫跨整個網格寬度 */
.more{grid-column:1/-1;margin-top:3px;background:var(--card2);border:1px solid #C9DFCF;
  color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:11px 0;
  border-radius:11px;cursor:pointer;transition:.15s}
.more:active{background:#DFEBD9}
.more span{font-weight:400;color:var(--tx3);font-size:11px;margin-left:6px}
/* 全澳總計那張是「表頭」、分隔線與空狀態也是 —— 都橫跨整個網格。
   網格現在每一種寬度都成立，所以這條要放在基礎層，不能只寫在桌機 media query 裡。 */
.pdiv,.phead,.empty{grid-column:1/-1}

/* heatmap */
.hm{margin-top:14px}
.hm-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.hm-hd b{font-size:13.5px;font-weight:600}
.hm-hd span{font-size:11px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:26px repeat(24,1fr);gap:2px}
.gl{font-size:9.5px;color:var(--tx3);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.hc{aspect-ratio:1;border-radius:2px;background:#EAF0E4}
.hc.na{background:#F1F5EC}
.hl{font-size:8.5px;color:var(--tx3);text-align:center;line-height:1}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10.5px;color:var(--tx3)}
.legend i{width:15px;height:9px;border-radius:2px;display:block}

/* charts */
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chart .hd b{font-size:13.5px;font-weight:600}
.chart .hd span{font-size:11px;color:var(--tx3)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.gline{stroke:#E2EADB;stroke-width:1}
.gtxt{fill:#7C937F;font-size:9px}
.blab{fill:#7C937F;font-size:9.5px;text-anchor:middle}
/* 白色描邊：把尖峰點從底下的淡色面積中「切」出來，淺色底才不會糊在一起 */
.pkdot{stroke:#FFFFFF;stroke-width:2}
.pktxt{font-size:9.5px;font-weight:600;text-anchor:middle}
/* 用 var(--accent)：切到電單車時曲線自動跟著變金色，不必再寫一份 override */
.cline{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.carea{fill:var(--accent);opacity:.13}
.cdot{fill:var(--accent)}
/* 每週高峰格仔圖沿用上面的 .grid / .hc（同一份資料在詳細卡與圖卡就該長得一樣，
   所以不另開一組 .gcell）。這裡只補兩件那組樣式沒有的東西：
   1. 最擠那一格要圈出來。單靠顏色在白底或深紅底上都會糊掉，
      所以用「外白內深」的雙框：box-shadow 在外、outline 在內，
      不管底下是空白的淺格還是滿載的深紅格，都看得見。
   2. 圈了之後還是要寫一行字說是哪一格，否則使用者得自己回頭數 168 格。 */
.hc.pk{outline:2px solid var(--tx);outline-offset:-2px;border-radius:3px;
  box-shadow:0 0 0 2px #FFFFFF}
.gcap{margin-top:9px;font-size:11px;color:var(--tx3);text-align:right}
.gcap b{color:var(--tx);font-weight:600}
.seg{display:flex;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--tx2);
  font:inherit;font-size:12px;padding:6px 0;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx);border-color:#C9DFCF}
/* ---- 可搜尋的停車場下拉（取代原本的 <select id="cpsel">）----
   全澳有 90 幾個停車場，原生 <select> 在手機上只能一路捲，沒辦法打關鍵字。
   改成 combobox：輸入框 + 自己畫的清單。清單用絕對定位浮在下方，
   不推擠版面（展開時圖表不會跳動）。 */
.picker{margin-top:16px}
.cbox{position:relative;margin-bottom:10px}
#cpq{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  color:var(--tx);font:inherit;font-size:14px;padding:11px 36px 11px 11px;outline:none
}
#cpq:focus{border-color:var(--accent)}
#cpq::placeholder{color:var(--tx3)}
/* ▾ 只是視覺提示（pointer-events:none 讓點擊穿透到輸入框），
   鍵盤與點擊的展開都交給輸入框自己處理，a11y 樹上不會多一顆沒有作用的按鈕 */
.cbox .cv{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--tx3);font-size:10px;pointer-events:none;transition:transform .18s}
.cbox.open .cv{transform:translateY(-50%) rotate(180deg)}
#cplist{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
  max-height:264px;overflow:auto;margin:0;padding:4px;list-style:none;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 28px rgba(31,58,44,.16)
}
#cplist[hidden]{display:none}
#cplist li{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px
}
#cplist li .z{font-size:10.5px;color:var(--tx3);white-space:nowrap}
#cplist li[aria-selected=true]{background:var(--card2);font-weight:600}
#cplist li.act{background:var(--card2)}
#cplist li mark{background:transparent;color:var(--accent);font-weight:700}
#cplist li.empty{justify-content:center;color:var(--tx3);cursor:default;font-size:12.5px}
.noData{font-size:11.5px;color:var(--tx3);text-align:center;padding:4px 0 8px}
.bigbtn{display:block;width:100%;margin-top:16px;background:var(--card2);border:1px solid #C9DFCF;
  color:var(--accent);font:inherit;font-size:13.5px;font-weight:600;padding:12px 0;border-radius:11px;cursor:pointer}
.bigbtn:active{background:#DFEBD9}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(31,58,44,.45);opacity:0;pointer-events:none;transition:.22s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;overflow-y:auto;
  background:#FFFFFF;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -8px 30px rgba(31,58,44,.18);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding:8px 16px calc(30px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain
}
.sheet.on{transform:translateY(0)}
.handle{width:38px;height:4px;border-radius:2px;background:#CBD9C4;margin:6px auto 14px}
.sheet h2{margin:0 0 3px;font-size:18px;font-weight:600;line-height:1.35}
.sheet .sz{font-size:11.5px;color:var(--tx3)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.slot{background:var(--card2);border-radius:11px;padding:9px 8px;text-align:center}
.slot b{display:block;font-size:17px;font-weight:600;letter-spacing:-.3px}
.slot b small{font-size:11px;font-weight:400;color:var(--tx3)}
.slot span{font-size:10.5px;color:var(--tx3);display:block;margin-top:2px}
.slot.hero{grid-column:span 3;background:linear-gradient(160deg,#E8F3E9,#DCEEE2);border:1px solid #C9DFCF}
.slot.hero b{font-size:28px;letter-spacing:-1px}
.slot.hero span{margin-top:5px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--card2);border-radius:8px;padding:6px 9px;font-size:11.5px;color:var(--tx2)}
.chip b{color:var(--tx);font-weight:600}
.sect{margin-top:16px;font-size:11.5px;color:var(--tx3);font-weight:600;letter-spacing:.5px}
.kv{margin-top:8px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.kv div{display:flex;gap:10px;font-size:12.5px}
.kv em{color:var(--tx3);font-style:normal;flex:0 0 64px}
.kv span{flex:1;color:var(--tx2);word-break:break-word}
.empty{text-align:center;color:var(--tx3);font-size:13px;padding:34px 0}
footer{margin-top:22px;text-align:center;font-size:11px;color:var(--tx3);line-height:1.7}
/* 管理員入口放在頁尾：它是少數人用的後台，不需要出現在主要動線上，
   但也不該藏到找不到 —— 頁尾是「找設定」時最自然會看的地方。 */
.fadmin{margin-top:14px}
.fadmin a{display:inline-flex;align-items:center;gap:5px;color:var(--tx3);
  text-decoration:none;font-size:11px;border:1px solid var(--line);border-radius:9px;
  padding:6px 12px;transition:.15s}
.fadmin a:hover{border-color:var(--accent);color:var(--accent)}

/* ---- 平板：三欄 ---- */
@media (min-width:640px){
  .wrap{max-width:720px;padding:0 18px calc(92px + env(safe-area-inset-bottom))}
  header{padding:calc(env(safe-area-inset-top,0px) + 26px) 0 12px}
  h1{font-size:22px}
  .list{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
}
/* ---- 桌面：四欄。520px 的單欄在寬螢幕上會變成一條窄窄的電話 ---- */
@media (min-width:900px){
  .wrap{max-width:980px}
  .list{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
}
/* ---- 手機：手指尺寸、安全區、iOS 不放大字 ---- */
@media (max-width:639px){
  .wrap{padding:0 12px calc(80px + env(safe-area-inset-bottom))}
  header{padding:calc(env(safe-area-inset-top,0px) + 18px) 0 10px}
  /* 16px 以下 iOS 會自動放大整個頁面，輸入框一定要 16px */
  input[type=search],select,#cpq{font-size:16px}
  .tabs button{padding:11px 0}
  .ctabs button{padding:8px 2px}
  .mbtn{padding:12px 10px 11px}
  .grid{grid-template-columns:20px repeat(24,1fr);gap:1.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>澳門公共停車場 · 實時車位</h1>
    <div class="sub">數據來源 交通事務局 DSAT · 每 30 分鐘自動採集 · <b id="gen"></b></div>
  </header>

  <div class="modes">
    <button class="mbtn" id="mb-car" onclick="setMode('car')">

current":{"car":23,"motor":null,"ev_car":13,"ev_motor":null,"disabled":4},"meta":{"address":"位於石排灣馬路及紅𣒍路之間的大廈內的停車場","phone":"2836 5806","entrance":"入口及出口均設於紅𣒍路","height_limit_m":"2.00","fee_light":"(日間)每半小時MOP$3(夜間) 每半小時MOP$1.5","fee_heavy":"-","fee_motor":"(日間)每半小時MOP$1(夜間) 每半小時MOP$0.5夜間封頂MOP$6"}}]};</script>
<script>
const D = window.__DATA__ || {carparks:[], modes:{}};
const WD = D.weekdays || ["週一","週二","週三","週四","週五","週六","週日"];
const MODES = D.mode_order && D.mode_order.length ? D.mode_order : Object.keys(D.modes||{});
let mode = MODES[0] || "car";
let tab = 0;

/* 色相維持 140°（綠）→ 0°（紅）代表使用率 0 → 1，方向與地圖頁一致（紅＝滿）。
   但淺色主題下亮度要反過來：格底要「淺到接近白」，文字要「深到看得清」。
   深色版原本是 30+20r%（暗底）／62%（亮字），直接搬過來會變成白底白字。 */
const col = r => r==null ? "#F1F5EC" : `hsl(${Math.round(140-140*r)},60%,${Math.round(90-40*r)}%)`;
const colText = r => r==null ? "#7C937F" : `hsl(${Math.round(140-140*r)},62%,36%)`;
const pct = r => r==null ? "--" : Math.round(r*100)+"%";
const nf = n => n==null ? "--" : n.toLocaleString("en-US");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 車種切換 ---------- */
function M(){ return (D.modes||{})[mode] || {overall:{}, charts:{}, by_id:{}}; }
function mLabel(){ return (D.modes||{})[mode] ? (D.modes[mode].label||mode) : ""; }
function md(id){ return M().by_id[id] || null; }

function modeRow(c){
  const m = md(c.id);
  if(!m) return null;
  return {
    id:c.id, name:c.name, zone:c.zone, meta:c.meta||{},
    cap_all:c.capacity||{}, cur_all:c.current||{}, updated_at:c.updated_at,
    cap:m.cap, free:m.free, rate:m.rate,
    heatmap:m.heatmap, samples:m.samples,
    profile:m.profile||[], weekday_profile:m.weekday_profile||[],
    peak:m.peak, peak_top:m.peak_top||[]
  };
}
function rowsForMode(){
  const out = [];
  (D.carparks||[]).forEach(c=>{ const r = modeRow(c); if(r) out.push(r); });
  return out;
}

function renderModes(){
  MODES.forEach(mid=>{
    const btn = document.getElementById("mb-"+mid);
    const ds  = document.getElementById("d-"+mid);
    if(!btn) return;
    btn.classList.toggle("on", mid===mode);
    const o = (D.modes||{})[mid] ? D.modes[mid].overall : {};
    if(ds) ds.textContent = `${o.rate==null?"--":Math.round(o.rate*100)+"%"} 滿 · ${nf(o.carparks)} 場`;
  });
  document.body.className = "mode-"+mode;
  const h = document.getElementById("mhint");
  if(h) h.textContent = `目前顯示：${mLabel()}車位（只統計有提供${mLabel()}位的停車場）`;
}

function setMode(m){
  if(!MODES.includes(m)) return;
  mode = m;
  renderModes();
  overview();
  initSel(true);
  renderCharts();
  resetPage();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function setTab(t){
  tab = t;
  document.getElementById("t1").classList.toggle("on", t===0);
  document.getElementById("t2").classList.toggle("on", t===1);
  document.getElementById("v1").style.display = t===0 ? "" : "none";
  document.getElementById("v2").style.display = t===1 ? "" : "none";
  render();
}

const WDS = ["一","二","三","四","五","六","日"];
const frame = (t,s,svg) => `<div class="chart"><div class="hd"><b>${t}</b><span>${s}</span></div>${svg}</div>`;

function lineChart(vals){
  const W=340,H=150,pL=30,pR=10,pT=14,pB=22;
  const pw=W-pL-pR, ph=H-pT-pB, n=vals.length||1;
  const X=i=>pL+(n>1?i/(n-1):0)*pw, Y=v=>pT+(1-v)*ph;
  let g="";
  [0,0.5,1].forEach(v=>{
    g+=`<line class="gline" x1="${pL}" y1="${Y(v)}" x2="${W-pR}" y2="${Y(v)}"/>`;
    g+=`<text class="gtxt" x="${pL-5}" y="${Y(v)+3}" text-anchor="end">${Math.round(v*100)}%</text>`;
  });
  const segs=[]; let cur=[];
  vals.forEach((v,i)=>{ if(v==null){ if(cur.length)segs.push(cur); cur=[]; } else cur.push([i,v]); });
  if(cur.length) segs.push(cur);
  let area="", line="";
  segs.forEach(s=>{
    const pts=s.map(([i,v])=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
    if(s.length>1){
      line+=`<polyline class="cline" points="${pts.join(" ")}"/>`;
      area+=`<polygon class="carea" points="${pts.join(" ")} ${X(s[s.length-1][0]).toFixed(1)},${pT+ph} ${X(s[0][0]).toFixed(1)},${pT+ph}"/>`;
    } else {
      line+=`<circle class="cdot" cx="${X(s[0][0]).toFixed(1)}" cy="${Y(s[0][1]).toFixed(1)}" r="2.6"/>`;
    }
  });
  let pi=-1,pv=-1;
  vals.forEach((v,i)=>{ if(v!=null&&v>pv){pv=v;pi=i;} });
  let pk="";
  if(pi>=0) pk=`<circle class="pkdot" cx="${X(pi).toFixed(1)}" cy="${Y(pv).toFixed(1)}" r="4" fill="${colText(pv)}"/>
    <text class="pktxt" x="${Math.min(W-pR-12,Math.max(pL+12,X(pi))).toFixed(1)}" y="${Y(pv)-9}" fill="${colText(pv)}">${String(pi).padStart(2,"0")}:00 ${Math.round(pv*100)}%</text>`;
  let xl="";
  [0,4,8,12,16,20,23].forEach(i=>{ xl+=`<text class="gtxt" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${i}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${area}${line}${pk}${xl}</svg>`;
}

function barChart(vals, labels){
  const W=340,H=132,pL=30,pR=10,pT=16,pB=24;
  const pw=W-pL-pR, ph=H-pT-pB, n=vals.length||1;
  const slot=pw/n, bw=Math.min(30, slot*0.56), Y=v=>pT+(1-v)*ph;
  let g="";
  [0,0.5,1].forEach(v=>{
    g+=`<line class="gline" x1="${pL}" y1="${Y(v)}" x2="${W-pR}" y2="${Y(v)}"/>`;
    g+=`<text class="gtxt" x="${pL-5}" y="${Y(v)+3}" text-anchor="end">${Math.round(v*100)}%</text>`;
  });
  let pi=-1,pv=-1;
  vals.forEach((v,i)=>{ if(v!=null&&v>pv){pv=v;pi=i;} });
  let bars="";
  vals.forEach((v,i)=>{
    const cx=pL+slot*i+slot/2, x=cx-bw/2;
    if(v==null){
      bars+=`<rect x="${x.toFixed(1)}" y="${pT+ph-3}" width="${bw.toFixed(1)}" height="3" rx="1.5" fill="#E4EDDF"/>`;
    } else {
      const y=Y(v), h=Math.max(2,pT+ph-y);
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${colText(v)}" opacity="${i===pi?1:.7}"/>`;
      bars+=`<text class="gtxt" x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" fill="${colText(v)}">${Math.round(v*100)}</text>`;
    }
    bars+=`<text class="blab" x="${cx.toFixed(1)}" y="${H-8}">${labels[i]||""}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
}

/* 每週高峰：直接重用 heatmapHTML()（見上方）——
   同一份資料不該在詳細卡與圖卡長得不一樣。差別只在這裡開 opts.peak，
   把最擠那一格圈出來並寫一行說明。 */

/* ---------- 可搜尋的停車場下拉 ----------
   原本是 <select id="cpsel">：全澳 90 幾個場，原生清單在手機上只能一路捲，沒得搜。
   這裡自己畫一個 combobox。狀態分四塊：
     CP_ID     目前「選中」的 id（圖表跟著它走）
     CP_OPTS   全部選項
     CP_SHOWN  清單上目前顯示的（鍵盤上下鍵走訪用）
     CP_TYPING 輸入框裡的字是「關鍵字」還是「選中的名稱」
   CP_TYPING 非有不可：否則輸入框會留著打到一半的字，
   看起來像選了一個不存在的停車場。 */
let CP_ID = "__all__";
let CP_OPTS = [];
let CP_SHOWN = [];
let CP_ACT = -1;
let CP_TYPING = false;

const cpEl = id => document.getElementById(id);

/* 保留 initSel 這個名字：setMode() 與啟動流程都在呼叫它，改名要多動三個地方，
   而它的職責沒變（把選項準備好）。 */
function initSel(reset){
  const q = cpEl("cpq");
  if(!q) return;
  if(!reset && CP_OPTS.length){ cpSetInput(); return; }
  CP_OPTS = [{id:"__all__", name:`全澳${mLabel()}整體`, zone:"全澳"}].concat(
    rowsForMode().slice().sort((a,b)=>a.name.localeCompare(b.name,"zh"))
      .map(c=>({id:c.id, name:c.name, zone:c.zone||""}))
  );
  /* 換車種之後，原本選的場可能整個不存在（只有私家車位的場，切到電單車就沒了）
     → 這種情況退回「全澳整體」，不要留著一個選不到的 id。 */
  if(!CP_OPTS.some(o=>o.id===CP_ID)){ CP_ID = "__all__"; CP_TYPING = false; }
  cpSetInput();
  cpDraw();
}

function cpLabel(id){
  const o = CP_OPTS.find(x=>x.id===id);
  return o ? o.name : "";
}
function cpSetInput(){
  const q = cpEl("cpq");
  if(q) q.value = cpLabel(CP_ID);
}

/* 名稱與區份都比對 —— 打「氹仔」可以列出那一區的場，不必記得全名 */
function cpMatches(kw){
  const k = (kw||"").trim().toLowerCase();
  if(!k) return CP_OPTS;
  return CP_OPTS.filter(o =>
    o.name.toLowerCase().includes(k) || (o.zone||"").toLowerCase().includes(k));
}

function cpMark(name, k){
  const i = name.toLowerCase().indexOf(k);
  if(i < 0) return esc(name);
  return esc(name.slice(0,i)) + "<mark>" + esc(name.slice(i, i+k.length)) + "</mark>" +
         esc(name.slice(i + k.length));
}

function cpDraw(){
  const list = cpEl("cplist"), q = cpEl("cpq");
  if(!list || !q) return;
  const kw = CP_TYPING ? q.value : "";
  CP_SHOWN = cpMatches(kw);
  if(CP_ACT >= CP_SHOWN.length) CP_ACT = CP_SHOWN.length - 1;
  if(!CP_SHOWN.length){
    list.innerHTML = `<li class="empty" role="presentation">找不到符合的停車場</li>`;
    return;
  }
  const k = kw.trim().toLowerCase();
  list.innerHTML = CP_SHOWN.map((o,i)=>
    `<li role="option" id="cpopt-${i}" data-id="${esc(o.id)}"`
    + ` aria-selected="${o.id===CP_ID}" class="${i===CP_ACT?"act":""}">`
    + `<span class="n">${k ? cpMark(o.name, k) : esc(o.name)}</span>`
    + `<span class="z">${esc(o.zone||"")}</span></li>`
  ).join("");
}

function cpOpen(open){
  const box = cpEl("cpbox"), list = cpEl("cplist"), q = cpEl("cpq");
  if(!box || !list || !q) return;
  box.classList.toggle("open", open);
  q.setAttribute("aria-expanded", open ? "true" : "false");
  list.hidden = !open;
  if(open) cpDraw();
}

/* restore=true：關閉時把輸入框還原成「選中的名稱」
   （使用者打到一半就點到別的地方，不該把半截關鍵字留在框裡） */
function cpClose(restore){
  if(restore){ CP_TYPING = false; cpSetInput(); }
  CP_ACT = -1;
  cpOpen(false);
}

function cpPick(id){
  CP_ID = id;
  CP_TYPING = false;
  CP_ACT = -1;
  cpSetInput();
  cpOpen(false);
  renderCharts();
}

function cpInit(){
  const q = cpEl("cpq"), list = cpEl("cplist");
  if(!q || !list) return;

  /* 聚焦就全選：這樣直接打字是「取代」而不是「接在後面」，
     不必先手動清掉原本的停車場名稱 */
  q.addEventListener("focus", ()=>{ cpOpen(true); if(q.select) q.select(); });
  q.addEventListener("input", ()=>{ CP_TYPING = true; CP_ACT = 0; cpOpen(true); });

  q.addEventListener("keydown", e=>{
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      if(list.hidden) cpOpen(true);
      if(!CP_SHOWN.length) return;
      CP_ACT = e.key === "ArrowDown"
        ? (CP_ACT + 1) % CP_SHOWN.length
        : (CP_ACT - 1 + CP_SHOWN.length) % CP_SHOWN.length;
      cpDraw();
      const act = cpEl("cpopt-" + CP_ACT);
      if(act && act.scrollIntoView) act.scrollIntoView({block:"nearest"});
    } else if(e.key === "Enter"){
      if(!list.hidden && CP_ACT >= 0 && CP_SHOWN[CP_ACT]){
        e.preventDefault();
        cpPick(CP_SHOWN[CP_ACT].id);
      }
    } else if(e.key === "Escape"){
      cpClose(true);
    }
  });

  /* 清單要先 preventDefault 掉 mousedown：不然輸入框會先 blur，
     清單在 click 之前就被收起來 —— 點了等於沒點。 */
  list.addEventListener("mousedown", e=>e.preventDefault());
  list.addEventListener("click", e=>{
    const li = e.target.closest ? e.target.closest("li[data-id]") : null;
    if(li) cpPick(li.getAttribute("data-id"));
  });

  document.addEventListener("click", e=>{
    const box = cpEl("cpbox");
    if(box && !box.contains(e.target)) cpClose(true);
  });
}

function pickChart(){
  if(CP_ID === "__all__") return allOver();
  const r = modeRow((D.carparks||[]).find(x=>x.id===CP_ID) || {});
  return (r && Object.keys(r).length) ? r : allOver();
}

/* ---------- 圖卡：三個分頁 ---------- */
let chartTab = 0;
const CTABS = ["24 小時使用率", "各星期平均", "每週高峰"];
function setChartTab(i){ chartTab = i; renderCharts(); }

function renderCharts(){
  const el = document.getElementById("charts");
  if(!el) return;
  const c = pickChart();
  const prof = c.profile||[], wk = c.weekday_profile||[], hm = c.heatmap||[];
  const sub = c.id==="__all__" ? "依車位數加權平均" : `${mLabel()}平均使用率`;
  /* 每個分頁各自判斷有沒有資料：有些場已經有 24 小時曲線，
     但 7×24 的熱力圖還沒累積到 —— 不該因為其中一個有值就三個都畫。 */
  const has = chartTab===0 ? prof.some(v=>v!=null)
            : chartTab===1 ? wk.some(v=>v!=null)
            : hm.some(r=>r && r.some(v=>v!=null));
  const body = !has ? ""
    : chartTab===0 ? lineChart(prof)
    : chartTab===1 ? barChart(wk, WDS)
    : heatmapHTML(hm, c.samples, {peak:true});
  el.innerHTML =
    `<div class="chart">
       <div class="hd"><b>${esc(c.name)} · ${CTABS[chartTab]}</b><span>${sub}</span></div>
       <div class="ctabs" role="tablist" aria-label="圖表類型">
         ${CTABS.map((t,i)=>`<button type="button" role="tab" aria-selected="${i===chartTab}"
             class="${i===chartTab?"on":""}" onclick="setChartTab(${i})">${t}</button>`).join("")}
       </div>
       ${body}
     </div>` +
    (has ? "" : `<div class="noData">這個停車場還沒有時段資料，圖表會在資料累積後自動出現</div>`);
}

function pinChart(id){
  cpPick(id);
  closeSheet();
  const el = document.getElementById("charts");
  if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
}

function allOver(){
  const M0 = M(), ch = M0.charts || {};
  const hm = ch.heatmap || [];
  const cells = [];
  for(let wd=0; wd<7; wd++) for(let hr=0; hr<24; hr++){
    const v = hm[wd] ? hm[wd][hr] : null;
    if(v!=null) cells.push({v,wd,hr});
  }
  cells.sort((a,b)=>b.v-a.v);
  const top = cells[0];
  return {
    id:"__all__", name:`全澳${mLabel()}整體`, zone:"全澳", meta:{},
    cap_all:{}, cur_all:{}, updated_at:null,
    cap:M0.overall.capacity, free:M0.overall.free, rate:M0.overall.rate,
    heatmap:hm, samples:null,
    profile:ch.profile||[], weekday_profile:ch.weekday||[],
    peak: top ? {rate:top.v, weekday:top.wd, weekday_label:WD[top.wd], hour:top.hr, samples:0} : null,
    peak_top: cells.slice(0,5).map(c=>({rate:c.v,weekday:c.wd,weekday_label:WD[c.wd],hour:c.hr,samples:0})),
  };
}


function overview(){
  const o = M().overall || {};
  document.getElementById("gen").textContent = (D.last_snapshot||D.generated_at||"") + " (UTC+8)";
  document.getElementById("orate").textContent = pct(o.rate);
  document.getElementById("arc").style.stroke = colText(o.rate);
  document.getElementById("arc").style.strokeDashoffset = 251.3 * (1 - (o.rate||0));
  document.getElementById("olab").textContent = mLabel()+"使用率";
  document.getElementById("socc").textContent = nf(o.occupied);
  document.getElementById("sfree").textContent = nf(o.free);
  document.getElementById("scap").textContent = nf(o.capacity);
  document.getElementById("scapl").textContent = mLabel()+"總車位";
  document.getElementById("scnt").textContent = nf(o.carparks);

  const fd = document.getElementById("fdesc");
  if(fd) fd.textContent = `使用率 = 1 − 剩餘 ÷ 總車位（${mLabel()}）`;

}

/* 7×24 的「星期 × 小時」熱力圖。停車場詳細卡與圖卡的「每週高峰」分頁共用這一個
   renderer —— 同一份資料在兩個地方長得一樣，改一次兩邊都改到。

   opts.peak=true 時額外做兩件事：把最擠那一格圈出來，並在下面寫一行「最擠 …」。
   這張圖要回答的是「一週裡面什麼時候最擠」，答案不該要使用者自己掃 168 格找。
   （列表那 24 張小圖不開這個選項 —— 一次 24 個圈圈只會變成雜訊。） */
function heatmapHTML(hm, samples, opts){
  opts = opts || {};
  let best = null;
  if(opts.peak){
    for(let wd=0; wd<7; wd++) for(let hr=0; hr<24; hr++){
      const v = hm && hm[wd] ? hm[wd][hr] : null;
      if(v != null && (!best || v > best.v)) best = {v, wd, hr};
    }
  }
  let h = '<div class="grid"><div class="gl"></div>';
  for(let hr=0; hr<24; hr++) h += `<div class="hl">${hr%3===0?hr:""}</div>`;
  for(let wd=0; wd<7; wd++){
    h += `<div class="gl">${WD[wd].slice(1)}</div>`;
    for(let hr=0; hr<24; hr++){
      const v = hm && hm[wd] ? hm[wd][hr] : null;
      const n = samples && samples[wd] ? samples[wd][hr] : 0;
      const na = v==null ? " na" : "";
      const pk = (best && best.wd===wd && best.hr===hr) ? " pk" : "";
      const tip = v==null ? "資料累積中" : `${WD[wd]} ${hr}:00 平均使用率 ${pct(v)}（${n} 筆）`;
      h += `<div class="hc${na}${pk}" style="background:${col(v)}" title="${tip}"></div>`;
    }
  }
  h += "</div>";
  h += `<div class="legend"><span>空</span>
    <i style="background:${col(0)}"></i><i style="background:${col(.25)}"></i>
    <i style="background:${col(.5)}"></i><i style="background:${col(.75)}"></i>
    <i style="background:${col(1)}"></i><span>滿</span>
    <span style="margin-left:auto">灰格 = 待累積</span></div>`;
  if(opts.peak){
    h += best
      ? `<div class="gcap">最擠 <b>${WD[best.wd]} ${String(best.hr).padStart(2,"0")}:00</b> · ${pct(best.v)}</div>`
      : `<div class="gcap">還沒有足夠資料找出高峰</div>`;
  }
  return h;
}

/* ---- 分頁 ----
   卡片縮小成一格一停車場之後，一頁放 24 張大約是 6 列，剛好一兩個螢幕高。
   剩下的用「載入更多」展開，而不是把 80 幾個停車場一次鋪完。 */
const PAGE_SIZE = 24;
/* 兩個分頁各自記住展開到第幾筆。用陣列而不是單一數字：切到「每週高峰」
   再切回來時，「即時車位」不該被重置回第一頁。 */
const shown = [PAGE_SIZE, PAGE_SIZE];

/* 篩選條件（關鍵字、排序）與車種都會同時改變兩個分頁的結果集，
   所以一次重置兩個 —— 否則搜尋「A」展開到 100 筆、再改搜「B」時，
   會以為結果只有 3 筆，其實只是沒有重新展開。
   切換分頁本身不重置：兩個分頁各有各的計數，位置應該被保留。 */
function resetPage(){ shown[0] = PAGE_SIZE; shown[1] = PAGE_SIZE; }
function onFilter(){ resetPage(); render(); }
function loadMore(){ shown[tab] += PAGE_SIZE; render(); }

const moreBtn = (n, t) =>
  `<button class="more" onclick="loadMore()">載入更多<span>已顯示 ${n} / ${t}</span></button>`;

function render(){
  const q = (document.getElementById("q").value||"").trim();
  const sort = document.getElementById("sort").value;
  let rows = rowsForMode().filter(r => !q || r.name.includes(q) || ((r.meta.address||"")).includes(q));

  if(tab===0){
    rows.sort((a,b)=>{
      if(sort==="name") return a.name.localeCompare(b.name,"zh");
      if(sort==="free") return (a.free??1e9)-(b.free??1e9);
      return (b.rate??-1)-(a.rate??-1);
    });
    const total = rows.length, vis = rows.slice(0, shown[0]);
    document.getElementById("list").innerHTML = total ? (
      vis.map(r=>{
        const r8 = r.rate;
        return `<div class="cp" onclick="openSheet('${r.id}')">
          <div class="top"><div class="nm">${esc(r.name)}</div><div class="zn">${esc(r.zone)}</div></div>
          <div class="mid">
            <span class="num">剩 <b>${r.free==null?"-":r.free}</b>/${r.cap==null?"-":r.cap}</span>
            <span class="rt" style="color:${colText(r8)}">${pct(r8)}</span>
          </div>
          <div class="track"><i style="width:${Math.round((r8||0)*100)}%;background:${colText(r8)}"></i></div>
        </div>`;
      }).join("") + (total > vis.length ? moreBtn(vis.length, total) : "")
    ) : `<div class="empty">找不到符合的停車場</div>`;
  } else {
    rows = rows.filter(r => r.peak);
    rows.sort((a,b)=> (b.peak?b.peak.rate:0) - (a.peak?a.peak.rate:0));
    const card = (c, cls) => {
      const p = c.peak;
      return `<div class="pk${cls ? " " + cls : ""}" onclick="openSheet('${c.id}')">
        <div class="n">${esc(c.name)}</div>
        <div class="p">高峰 <b style="color:${colText(p.rate)}">${p.weekday_label} ${String(p.hour).padStart(2,"0")}:00</b></div>
        <div class="r"><b style="color:${colText(p.rate)}">${pct(p.rate)}</b><span>使用率</span></div>
      </div>`;
    };
    const ao = allOver();
    /* 桌面多欄時這張橫跨整列（.phead）。注意不能寫 rows.map(card)——
       map 會把 index 當第二個參數傳進來，index>=1 就會被當成 class 名稱。 */
    const head = (!q && ao.peak) ? card(ao, "phead") : "";
    const total = rows.length, vis = rows.slice(0, shown[1]);
    const body = total ? vis.map(c => card(c)).join("")
        + (total > vis.length ? moreBtn(vis.length, total) : "")
      : `<div class="empty">尚無足夠資料判斷${mLabel()}高峰時段<br><span style="font-size:12px">資料持續累積中</span></div>`;
    document.getElementById("plist").innerHTML =
      (head ? head + `<div class="pdiv" style="height:1px;background:var(--line);margin:10px 2px"></div>` : "") + body;
  }
}

function openSheet(id){
  const c = id==="__all__" ? allOver() : modeRow((D.carparks||[]).find(x=>x.id===id) || {});
  if(!c || !Object.keys(c).length) return;
  const cur = c.cur_all||{}, capA = c.cap_all||{};

  const sub = id==="__all__"
    ? `全澳 ${nf(M().overall.carparks)} 個有${mLabel()}位的停車場 · 依車位數加權`
    : `${esc(c.zone)} · 更新 ${esc(c.updated_at||"--")}`;
  let h = `<h2>${esc(c.name)}</h2><div class="sz">${sub}</div>`;

  /* 主角：目前車種 */
  h += `<div class="slots">
    <div class="slot hero"><b style="color:${colText(c.rate)}">${c.free==null?"-":c.free}<small> / ${nf(c.cap)}</small></b>
      <span>${esc(mLabel())}剩餘車位 · 使用率 ${pct(c.rate)}</span></div>
  </div>`;

  /* 其他車種（次要資訊） */
  const others = [];
  if(mode!=="car"     && cur.car!=null)      others.push(["私家車", cur.car, capA.car]);
  if(mode!=="motor"   && cur.motor!=null)    others.push(["電單車", cur.motor, capA.motor]);
  if(cur.ev_car!=null)   others.push(["電動汽車", cur.ev_car, capA.ev_car]);
  if(cur.ev_motor!=null) others.push(["電動電單車", cur.ev_motor, capA.ev_motor]);
  if(cur.disabled!=null) others.push(["傷殘車位", cur.disabled, capA.disabled]);
  if(others.length){
    h += `<div class="sect">其他車位（即時）</div><div class="chips">${others.map(([l,f,t])=>
      `<span class="chip">${l} 剩 <b style="color:${colText(f!=null&&t?1-f/t:null)}">${f}</b>${t?` / ${t}`:""}</span>`).join("")}</div>`;
  }

  h += frame(`${esc(mLabel())}24 小時使用量曲線`,"平均使用率", lineChart(c.profile||[]));
  h += frame(`${esc(mLabel())}各星期平均使用率`,"", barChart(c.weekday_profile||[], WDS));

  if(c.peak){
    h += `<div class="hm"><div class="hm-hd"><b>每週使用高峰（${esc(mLabel())}）</b><span>${c.peak.samples} 筆樣本 @ 尖峰</span></div>
      ${heatmapHTML(c.heatmap, c.samples)}
      <div class="chips">${c.peak_top.map(p=>
        `<span class="chip">${p.weekday_label} ${String(p.hour).padStart(2,"0")}:00 <b style="color:${colText(p.rate)}">${pct(p.rate)}</b></span>`
      ).join("")}</div></div>`;
  } else {
    h += `<div class="hm"><div class="hm-hd"><b>每週使用高峰（${esc(mLabel())}）</b><span>資料累積中</span></div>
      <div class="empty" style="padding:20px 0">這個停車場還沒有足夠的歷史樣本</div></div>`;
  }

  if(id!=="__all__")
    h += `<button class="bigbtn" onclick="pinChart('${c.id}')">在上方圖表顯示這個停車場</button>`;

  const m = c.meta||{};
  h += `<div class="kv">
    ${m.address?`<div><em>位置</em><span>${esc(m.address)}</span></div>`:""}
    ${m.phone?`<div><em>電話</em><span>${esc(m.phone)}</span></div>`:""}
    ${m.height_limit_m?`<div><em>高度限制</em><span>${esc(m.height_limit_m)} 米</span></div>`:""}
    ${m.fee_light?`<div><em>輕型車收費</em><span>${esc(m.fee_light)}</span></div>`:""}
    ${m.fee_motor?`<div><em>電單車收費</em><span>${esc(m.fee_motor)}</span></div>`:""}
  </div>`;

  document.getElementById("sbody").innerHTML = h;
  document.getElementById("mask").classList.add("on");
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){
  document.getElementById("mask").classList.remove("on");
  document.getElementById("sheet").classList.remove("on");
}

renderModes();
overview();
cpInit();          // 事件只要綁一次，要在 initSel() 之前
initSel(true);
renderCharts();
render();
</script>
