<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B0E14">
<title>澳門停車場實時車位</title>
<style>
:root{
  --bg:#0B0E14; --card:#141A24; --card2:#1A2230; --line:#232E3E;
  --tx:#E6EDF3; --tx2:#9AA7B8; --tx3:#6B7889;
  --ok:#2EA043; --warn:#D29922; --bad:#F85149; --accent:#4C8DFF;
}
body.mode-motor{--accent:#F0A33C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 40px}

/* header */
header{padding:22px 0 12px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.3px}
.sub{margin-top:5px;font-size:12px;color:var(--tx3)}
.sub b{color:var(--tx2);font-weight:500}

/* ---- 頂部兩大分類 ---- */
.modes{display:flex;gap:10px;margin:16px 0 6px}
.mbtn{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 10px 12px;cursor:pointer;text-align:center;transition:.18s;color:var(--tx2)
}
.mbtn:active{transform:scale(.985)}
.mbtn .ico{display:block;margin:0 auto 6px;color:var(--tx3)}
.mbtn .nm{font-size:15.5px;font-weight:600;color:var(--tx);letter-spacing:.3px}
.mbtn .ds{font-size:11px;color:var(--tx3);margin-top:3px}
.mbtn.on{border-color:transparent;color:#fff}
.mbtn.on .ico,.mbtn.on .ds{color:rgba(255,255,255,.82)}
.mbtn.on .nm{color:#fff}
#mb-car.on{background:linear-gradient(160deg,#2A5FBF,#1B3E80);box-shadow:0 4px 16px rgba(76,141,255,.22)}
#mb-motor.on{background:linear-gradient(160deg,#B9741F,#80500F);box-shadow:0 4px 16px rgba(240,163,60,.22)}
.mhint{font-size:11px;color:var(--tx3);text-align:center;margin:0 0 4px}

/* data progress banner */
.banner{
  margin:12px 0 16px;padding:11px 13px;border-radius:12px;
  background:linear-gradient(90deg,rgba(76,141,255,.14),rgba(76,141,255,.04));
  border:1px solid rgba(76,141,255,.28);font-size:12px;color:var(--tx2);line-height:1.55
}
body.mode-motor .banner{
  background:linear-gradient(90deg,rgba(240,163,60,.14),rgba(240,163,60,.04));
  border-color:rgba(240,163,60,.28)
}
.banner b{color:var(--accent);font-weight:600}
.bar{height:5px;border-radius:3px;background:#1B2431;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s}

/* overview */
.ov{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.ring{position:relative;width:96px;height:96px;flex:0 0 96px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:23px;font-weight:600;letter-spacing:-.5px}
.ring .val span{font-size:10px;color:var(--tx3);margin-top:1px}
.stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.stat{background:var(--card2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px}
.stat span{font-size:11px;color:var(--tx3)}

/* tabs */
.tabs{display:flex;gap:6px;margin:18px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{
  flex:1;border:0;background:transparent;color:var(--tx2);font:inherit;font-size:14px;font-weight:500;
  padding:9px 0;border-radius:9px;cursor:pointer;transition:.18s
}
.tabs button.on{background:var(--accent);color:#0B0E14;font-weight:600}
body.mode-motor .tabs button.on{color:#1B1204}

/* search + sort */
.tools{display:flex;gap:8px;margin-bottom:12px}
input[type=search]{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;color:var(--tx);font:inherit;font-size:14px;outline:none
}
input[type=search]:focus{border-color:var(--accent)}
select{
  background:var(--card);border:1px solid var(--line);border-radius:11px;color:var(--tx2);
  font:inherit;font-size:13px;padding:10px 8px;outline:none
}

/* carpark cards */
.list{display:flex;flex-direction:column;gap:9px}
.cp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.15s}
.cp:active{background:var(--card2)}
.cp .top{display:flex;align-items:baseline;gap:8px}
.cp .nm{font-size:15px;font-weight:500;flex:1;line-height:1.35}
.cp .zn{font-size:10px;color:var(--tx3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.cp .mid{display:flex;align-items:center;gap:10px;margin-top:9px}
.cp .num{font-size:13px;color:var(--tx2);white-space:nowrap}
.cp .num b{font-size:19px;font-weight:600;color:var(--tx);letter-spacing:-.3px}
.track{flex:1;height:7px;border-radius:4px;background:#1B2431;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}
.cp .ft{margin-top:7px;font-size:11px;color:var(--tx3);display:flex;justify-content:space-between;gap:8px}

/* peak row */
.pk{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:10px}
.pk:active{background:var(--card2)}
.pk .l{flex:1;min-width:0}
.pk .l .n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .l .p{font-size:11.5px;color:var(--tx3);margin-top:3px}
.pk .l .p b{font-weight:600}
.pk .r{text-align:right;flex:0 0 auto}
.pk .r b{display:block;font-size:17px;font-weight:600;letter-spacing:-.3px}
.pk .r span{font-size:10px;color:var(--tx3)}

/* heatmap */
.hm{margin-top:14px}
.hm-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.hm-hd b{font-size:13.5px;font-weight:600}
.hm-hd span{font-size:11px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:26px repeat(24,1fr);gap:2px}
.gl{font-size:9.5px;color:var(--tx3);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.hc{aspect-ratio:1;border-radius:2px;background:#161D28}
.hc.na{background:#131922}
.hl{font-size:8.5px;color:var(--tx3);text-align:center;line-height:1}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10.5px;color:var(--tx3)}
.legend i{width:15px;height:9px;border-radius:2px;display:block}

/* charts */
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chart .hd b{font-size:13.5px;font-weight:600}
.chart .hd span{font-size:11px;color:var(--tx3)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.gline{stroke:#202A38;stroke-width:1}
.gtxt{fill:#5C6879;font-size:9px}
.blab{fill:#7A8798;font-size:9.5px;text-anchor:middle}
.pkdot{stroke:#0B0E14;stroke-width:2}
.pktxt{font-size:9.5px;font-weight:600;text-anchor:middle}
.cline{stroke:#4C8DFF;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.carea{fill:rgba(76,141,255,.13)}
.cdot{fill:#4C8DFF}
body.mode-motor .cline{stroke:#F0A33C}
body.mode-motor .carea{fill:rgba(240,163,60,.13)}
body.mode-motor .cdot{fill:#F0A33C}
.seg{display:flex;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--tx2);
  font:inherit;font-size:12px;padding:6px 0;border-radius:8px;cursor:pointer}
.seg button.on{background:#1E2A3A;color:var(--tx);border-color:#33465C}
.hstat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hstat div{background:var(--card2);border-radius:10px;padding:9px 10px}
.hstat b{display:block;font-size:19px;font-weight:600;letter-spacing:-.3px}
.hstat span{font-size:11px;color:var(--tx3)}
.hstat i{font-style:normal;font-size:11px;margin-left:4px}
.hrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:9px;gap:8px}
.hrow b{font-weight:500;color:var(--tx2)}
.hbars{margin-top:11px}
#cpsel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  color:var(--tx);font:inherit;font-size:14px;padding:11px 10px;outline:none;margin-bottom:10px;
  -webkit-appearance:none;appearance:none}
#cpsel:focus{border-color:var(--accent)}
.noData{font-size:11.5px;color:var(--tx3);text-align:center;padding:4px 0 8px}
.bigbtn{display:block;width:100%;margin-top:16px;background:#1E2A3A;border:1px solid #33465C;
  color:var(--tx);font:inherit;font-size:13.5px;padding:12px 0;border-radius:11px;cursor:pointer}
.bigbtn:active{background:#26344A}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.22s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;overflow-y:auto;
  background:#10161F;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding:8px 16px calc(30px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;-webkit-overflow-scrolling:touch
}
.sheet.on{transform:translateY(0)}
.handle{width:38px;height:4px;border-radius:2px;background:#2C3949;margin:6px auto 14px}
.sheet h2{margin:0 0 3px;font-size:18px;font-weight:600;line-height:1.35}
.sheet .sz{font-size:11.5px;color:var(--tx3)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.slot{background:var(--card2);border-radius:11px;padding:9px 8px;text-align:center}
.slot b{display:block;font-size:17px;font-weight:600;letter-spacing:-.3px}
.slot b small{font-size:11px;font-weight:400;color:var(--tx3)}
.slot span{font-size:10.5px;color:var(--tx3);display:block;margin-top:2px}
.slot.hero{grid-column:span 3;background:linear-gradient(160deg,#1E2A3A,#172030);border:1px solid #33465C}
.slot.hero b{font-size:28px;letter-spacing:-1px}
.slot.hero span{margin-top:5px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--card2);border-radius:8px;padding:6px 9px;font-size:11.5px;color:var(--tx2)}
.chip b{color:var(--tx);font-weight:600}
.sect{margin-top:16px;font-size:11.5px;color:var(--tx3);font-weight:600;letter-spacing:.5px}
.kv{margin-top:8px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.kv div{display:flex;gap:10px;font-size:12.5px}
.kv em{color:var(--tx3);font-style:normal;flex:0 0 64px}
.kv span{flex:1;color:var(--tx2);word-break:break-word}
.empty{text-align:center;color:var(--tx3);font-size:13px;padding:34px 0}
footer{margin-top:22px;text-align:center;font-size:11px;color:#4A5666;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>澳門公共停車場 · 實時車位</h1>
    <div class="sub">數據來源 交通事務局 DSAT · 每 30 分鐘自動採集 · <b id="gen"></b></div>
  </header>

  <div class="modes">
    <button class="mbtn" id="mb-car" onclick="setMode('car')">
      <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15.5h16M5.5 15.5v-2.4l1.9-4.1A2 2 0 019.2 7.6h5.6a2 2 0 011.8 1.1l1.9 4.3v2.5"/>
        <circle cx="7.6" cy="16.6" r="1.7"/><circle cx="16.4" cy="16.6" r="1.7"/>
      </svg>

    <button class="mbtn" id="mb-motor" onclick="setMode('motor')">
      <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5.4" cy="16.2" r="3.1"/><circle cx="18.6" cy="16.2" r="3.1"/>
        <path d="M5.4 16.2l3.4-6.1h4.4l1.9 6.1M8.8 10.1l2.6-4.2h3.2M13.4 16.2h5.2"/>
      </svg>
      <div class="nm">電單車</div><div class="ds" id="d-motor">--</div>
    </button>
  </div>
  <div class="mhint" id="mhint">私家車與電單車車位分開統計，請先選擇你的車種</div>

  <div class="banner" id="banner"></div>

  <div class="chart" id="health" style="margin-top:16px"></div>

  <div class="ov">
    <div class="ring">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="#1B2431" stroke-width="9"/>
        <circle id="arc" cx="48" cy="48" r="40" fill="none" stroke="#F85149" stroke-width="9"
                stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
      </svg>
      <div class="val"><b id="orate">--</b><span id="olab">全澳使用率</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="socc">--</b><span>使用中車位</span></div>
      <div class="stat"><b id="sfree">--</b><span>剩餘車位</span></div>
      <div class="stat"><b id="scap">--</b><span id="scapl">總車位</span></div>
      <div class="stat"><b id="scnt">--</b><span>有此車位場數</span></div>
    </div>
  </div>

  <div style="margin-top:16px">
    <select id="cpsel" onchange="renderCharts()"></select>
    <div id="charts"></div>
  </div>

  <div class="tabs">
    <button id="t1" class="on" onclick="setTab(0)">即時車位</button>
    <button id="t2" onclick="setTab(1)">每週高峰</button>
  </div>

  <div class="tools">
    <input type="search" id="q" placeholder="搜尋停車場名稱…" oninput="render()">
    <select id="sort" onchange="render()">
      <option value="rate">使用率</option>
      <option value="free">剩餘少</option>
      <option value="name">名稱</option>
    </select>
  </div>

  <div id="v1"><div class="list" id="list"></div></div>
  <div id="v2" style="display:none"><div class="list" id="plist"></div></div>

  <footer>
    <span id="fdesc">使用率 = 1 − 剩餘 ÷ 總車位（私家車）</span><br>
    時段為澳門時間 UTC+8 · 顏色越紅代表越滿
  </footer>
</div>

<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div id="sbody"></div>
</div>

<script>
const D = window.__DATA__ || {carparks:[], modes:{}};
const WD = D.weekdays || ["週一","週二","週三","週四","週五","週六","週日"];
const MODES = D.mode_order && D.mode_order.length ? D.mode_order : Object.keys(D.modes||{});
let mode = MODES[0] || "car";
let tab = 0;

const col = r => r==null ? "#131922" : `hsl(${Math.round(140-140*r)},62%,${Math.round(30+20*r)}%)`;
const colText = r => r==null ? "#6B7889" : `hsl(${Math.round(140-140*r)},70%,62%)`;
const pct = r => r==null ? "--" : Math.round(r*100)+"%";
const nf = n => n==null ? "--" : n.toLocaleString("en-US");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 車種切換 ---------- */
function M(){ return (D.modes||{})[mode] || {overall:{}, charts:{}, by_id:{}}; }
function mLabel(){ return (D.modes||{})[mode] ? (D.modes[mode].label||mode) : ""; }
function md(id){ return M().by_id[id] || null; }

function modeRow(c){
  const m = md(c.id);
  if(!m) return null;
  return {
    id:c.id, name:c.name, zone:c.zone, meta:c.meta||{},
    cap_all:c.capacity||{}, cur_all:c.current||{}, updated_at:c.updated_at,
    cap:m.cap, free:m.free, rate:m.rate,
    heatmap:m.heatmap, samples:m.samples,
    profile:m.profile||[], weekday_profile:m.weekday_profile||[],
    peak:m.peak, peak_top:m.peak_top||[]
  };
}
function rowsForMode(){
  const out = [];
  (D.carparks||[]).forEach(c=>{ const r = modeRow(c); if(r) out.push(r); });
  return out;
}

function renderModes(){
  MODES.forEach(mid=>{
    const btn = document.getElementById("mb-"+mid);
    const ds  = document.getElementById("d-"+mid);
    if(!btn) return;
    btn.classList.toggle("on", mid===mode);
    const o = (D.modes||{})[mid] ? D.modes[mid].overall : {};
    if(ds) ds.textContent = `${o.rate==null?"--":Math.round(o.rate*100)+"%"} 滿 · ${nf(o.carparks)} 場`;
  });
  document.body.className = "mode-"+mode;
  const h = document.getElementById("mhint");
  if(h) h.textContent = `目前顯示：${mLabel()}車位（只統計有提供${mLabel()}位的停車場）`;
}

function setMode(m){
  if(!MODES.includes(m)) return;
  mode = m;
  renderModes();
  overview();
  initSel(true);
  renderCharts();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function setTab(t){
  tab = t;
  document.getElementById("t1").classList.toggle("on", t===0);
  document.getElementById("t2").classList.toggle("on", t===1);
  document.getElementById("v1").style.display = t===0 ? "" : "none";
  document.getElementById("v2").style.display = t===1 ? "" : "none";
  render();
}

const WDS = ["一","二","三","四","五","六","日"];
const frame = (t,s,svg) => `<div class="chart"><div class="hd"><b>${t}</b><span>${s}</span></div>${svg}</div>`;

function lineChart(vals){
  const W=340,H=150,pL=30,pR=10,pT=14,pB=22;
  const pw=W-pL-pR, ph=H-pT-pB, n=vals.length||1;
  const X=i=>pL+(n>1?i/(n-1):0)*pw, Y=v=>pT+(1-v)*ph;
  let g="";
  [0,0.5,1].forEach(v=>{
    g+=`<line class="gline" x1="${pL}" y1="${Y(v)}" x2="${W-pR}" y2="${Y(v)}"/>`;
    g+=`<text class="gtxt" x="${pL-5}" y="${Y(v)+3}" text-anchor="end">${Math.round(v*100)}%</text>`;
  });
  const segs=[]; let cur=[];
  vals.forEach((v,i)=>{ if(v==null){ if(cur.length)segs.push(cur); cur=[]; } else cur.push([i,v]); });
  if(cur.length) segs.push(cur);
  let area="", line="";
  segs.forEach(s=>{
    const pts=s.map(([i,v])=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
    if(s.length>1){
      line+=`<polyline class="cline" points="${pts.join(" ")}"/>`;
      area+=`<polygon class="carea" points="${pts.join(" ")} ${X(s[s.length-1][0]).toFixed(1)},${pT+ph} ${X(s[0][0]).toFixed(1)},${pT+ph}"/>`;
    } else {
      line+=`<circle class="cdot" cx="${X(s[0][0]).toFixed(1)}" cy="${Y(s[0][1]).toFixed(1)}" r="2.6"/>`;
    }
  });
  let pi=-1,pv=-1;
  vals.forEach((v,i)=>{ if(v!=null&&v>pv){pv=v;pi=i;} });
  let pk="";
  if(pi>=0) pk=`<circle class="pkdot" cx="${X(pi).toFixed(1)}" cy="${Y(pv).toFixed(1)}" r="4" fill="${colText(pv)}"/>
    <text class="pktxt" x="${Math.min(W-pR-12,Math.max(pL+12,X(pi))).toFixed(1)}" y="${Y(pv)-9}" fill="${colText(pv)}">${String(pi).padStart(2,"0")}:00 ${Math.round(pv*100)}%</text>`;
  let xl="";
  [0,4,8,12,16,20,23].forEach(i=>{ xl+=`<text class="gtxt" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${i}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${area}${line}${pk}${xl}</svg>`;
}

function barChart(vals, labels){
  const W=340,H=132,pL=30,pR=10,pT=16,pB=24;
  const pw=W-pL-pR, ph=H-pT-pB, n=vals.length||1;
  const slot=pw/n, bw=Math.min(30, slot*0.56), Y=v=>pT+(1-v)*ph;
  let g="";
  [0,0.5,1].forEach(v=>{
    g+=`<line class="gline" x1="${pL}" y1="${Y(v)}" x2="${W-pR}" y2="${Y(v)}"/>`;
    g+=`<text class="gtxt" x="${pL-5}" y="${Y(v)+3}" text-anchor="end">${Math.round(v*100)}%</text>`;
  });
  let pi=-1,pv=-1;
  vals.forEach((v,i)=>{ if(v!=null&&v>pv){pv=v;pi=i;} });
  let bars="";
  vals.forEach((v,i)=>{
    const cx=pL+slot*i+slot/2, x=cx-bw/2;
    if(v==null){
      bars+=`<rect x="${x.toFixed(1)}" y="${pT+ph-3}" width="${bw.toFixed(1)}" height="3" rx="1.5" fill="#1B2431"/>`;
    } else {
      const y=Y(v), h=Math.max(2,pT+ph-y);
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${colText(v)}" opacity="${i===pi?1:.7}"/>`;
      bars+=`<text class="gtxt" x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" fill="${colText(v)}">${Math.round(v*100)}</text>`;
    }
    bars+=`<text class="blab" x="${cx.toFixed(1)}" y="${H-8}">${labels[i]||""}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
}

function initSel(reset){
  const sel = document.getElementById("cpsel");
  if(!sel) return;
  if(!reset && sel.options.length) return;
  const list = [{id:"__all__", name:`全澳${mLabel()}整體`}].concat(
    rowsForMode().slice().sort((a,b)=>a.name.localeCompare(b.name,"zh"))
      .map(c=>({id:c.id, name:c.name}))
  );
  sel.innerHTML = list.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join("");
  sel.value = "__all__";
}

function pickChart(){
  const sel = document.getElementById("cpsel");
  const id = sel ? sel.value : "__all__";
  if(id==="__all__") return allOver();
  const r = modeRow((D.carparks||[]).find(x=>x.id===id) || {});
  return Object.keys(r).length ? r : allOver();
}

function renderCharts(){
  const el = document.getElementById("charts");
  if(!el) return;
  const c = pickChart();
  const prof = c.profile||[], wk = c.weekday_profile||[];
  const sub = c.id==="__all__" ? "依車位數加權平均" : `${mLabel()}平均使用率`;
  el.innerHTML =
    frame(`${esc(c.name)} · 24 小時使用率`, sub, lineChart(prof)) +
    frame(`${esc(c.name)} · 各星期平均使用率`, sub, barChart(wk, WDS)) +
    (!prof.some(v=>v!=null)
      ? `<div class="noData">這個停車場還沒有時段資料，圖表會在資料累積後自動出現</div>` : "");
}

function pinChart(id){
  const sel = document.getElementById("cpsel");
  if(sel){ sel.value = id; renderCharts(); }
  closeSheet();
  const el = document.getElementById("charts");
  if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
}

function allOver(){
  const M0 = M(), ch = M0.charts || {};
  const hm = ch.heatmap || [];
  const cells = [];
  for(let wd=0; wd<7; wd++) for(let hr=0; hr<24; hr++){
    const v = hm[wd] ? hm[wd][hr] : null;
    if(v!=null) cells.push({v,wd,hr});
  }
  cells.sort((a,b)=>b.v-a.v);
  const top = cells[0];
  return {
    id:"__all__", name:`全澳${mLabel()}整體`, zone:"全澳", meta:{},
    cap_all:{}, cur_all:{}, updated_at:null,
    cap:M0.overall.capacity, free:M0.overall.free, rate:M0.overall.rate,
    heatmap:hm, samples:null,
    profile:ch.profile||[], weekday_profile:ch.weekday||[],
    peak: top ? {rate:top.v, weekday:top.wd, weekday_label:WD[top.wd], hour:top.hr, samples:0} : null,
    peak_top: cells.slice(0,5).map(c=>({rate:c.v,weekday:c.wd,weekday_label:WD[c.wd],hour:c.hr,samples:0})),
  };
}

const COL = D.collection || {};

function minsAgo(ts){
  if(!ts) return null;
  const p = ts.split(" ");
  if(p.length < 2) return null;
  const d = p[0].split("-").map(Number), t = p[1].split(":").map(Number);
  const then = new Date(d[0], d[1]-1, d[2], t[0], t[1], t[2]||0);
  return (Date.now() - then.getTime()) / 60000;
}

function hourBars(counts, perHour){
  const W=340,H=92,pL=4,pR=4,pT=6,pB=17;
  const pw=W-pL-pR, ph=H-pT-pB, n=counts.length;
  const slot=pw/n, bw=Math.max(4, slot*0.62);
  const top=Math.max(perHour, ...counts);
  let bars="";
  counts.forEach((c,i)=>{
    const cx=pL+slot*i+slot/2;
    const h=c>0 ? Math.max(4, (c/top)*ph) : 3;
    const y=pT+ph-h;
    const fill = c===0 ? "#1B2431" : (c>=perHour ? "#2EA043" : "#D29922");
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${fill}"/>`;
    if(i%3===0) bars+=`<text class="gtxt" x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle">${i}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${bars}</svg>`;
}

function renderHealth(){
  const el = document.getElementById("health");
  if(!el) return;
  const m = minsAgo(COL.last);
  /* 目標是每 30 分鐘一次：35 分鐘內算正常，超過 90 分鐘就是真的停了 */
  const ok = m!=null && m < 35, warn = m!=null && m >= 35 && m < 90;
  const dot = m==null ? "#6B7889" : (ok ? "#2EA043" : (warn ? "#D29922" : "#F85149"));
  const ago = m==null ? "--" : (m < 60 ? `${Math.round(m)} 分鐘前` : `${(m/60).toFixed(1)} 小時前`);
  const state = m==null ? "無資料" : (ok ? "正常" : (warn ? "偏慢" : "已停擺"));
  const pctToday = COL.expected_today ? Math.min(100, Math.round(COL.today/COL.expected_today*100)) : 0;

  const gmin = x => x==null ? "--" : (x < 60 ? `${Math.round(x)} 分` : `${(x/60).toFixed(1)} 小時`);
  const gcol = x => x==null ? "#6B7889" : (x <= 35 ? "#2EA043" : (x <= 75 ? "#D29922" : "#F85149"));
  const tgt = COL.target_gap_min || 30;

  el.innerHTML = `
    <div class="hd"><b>採集狀態</b>
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${dot};margin-right:5px"></span>${state}</span></div>
    <div class="hstat">
      <div><b>${nf(COL.total)}</b><span>累計採集次數</span></div>
      <div><b style="color:${ok?'#2EA043':(warn?'#D29922':'#F85149')}">${ago}</b><span>距離上次採集</span></div>
      <div><b style="color:${gcol(COL.median_gap_min)}">${gmin(COL.median_gap_min)}</b><span>平均採集間隔<i style="color:#4A5666">/ ${tgt} 分</i></span></div>
      <div><b style="color:${gcol(COL.last_gap_min)}">${gmin(COL.last_gap_min)}</b><span>最近一次間隔</span></div>
      <div><b>${nf(COL.today)}<i style="color:var(--tx3);font-size:12px"> / ${nf(COL.expected_today)}</i></b><span>今日採集（${pctToday}%）</span></div>
      <div><b>${nf(COL.hours_covered)}<i style="color:var(--tx3);font-size:12px"> / 24</i></b><span>今日有資料的時段</span></div>
    </div>
    <div class="hrow"><span>首次 <b>${esc((COL.first||"--").slice(5,16))}</b></span>
      <span>最近 <b>${esc((COL.last||"--").slice(5,16))}</b></span></div>
    <div class="hbars">${hourBars(COL.hourly_today||new Array(24).fill(0), COL.expected_per_hour||2)}
      <div class="hrow" style="margin-top:6px"><span>綠＝該小時採滿 ${COL.expected_per_hour||2} 筆</span>
      <span>灰＝完全沒採到</span></div></div>`;
}

function overview(){
  const o = M().overall || {};
  document.getElementById("gen").textContent = (D.last_snapshot||D.generated_at||"") + " (UTC+8)";
  document.getElementById("orate").textContent = pct(o.rate);
  document.getElementById("arc").style.stroke = colText(o.rate);
  document.getElementById("arc").style.strokeDashoffset = 251.3 * (1 - (o.rate||0));
  document.getElementById("olab").textContent = mLabel()+"使用率";
  document.getElementById("socc").textContent = nf(o.occupied);
  document.getElementById("sfree").textContent = nf(o.free);
  document.getElementById("scap").textContent = nf(o.capacity);
  document.getElementById("scapl").textContent = mLabel()+"總車位";
  document.getElementById("scnt").textContent = nf(o.carparks);

  const fd = document.getElementById("fdesc");
  if(fd) fd.textContent = `使用率 = 1 − 剩餘 ÷ 總車位（${mLabel()}）`;

  const days = D.days_covered || 0;
  const need = 7;
  const p = Math.min(100, Math.round(days/need*100));
  document.getElementById("banner").innerHTML =
    `<b>週間高峰分析 · 資料累積 ${days} / ${need} 天</b>
     <div class="bar"><i style="width:${p}%"></i></div>
     <div style="margin-top:7px">${days < need
       ? `已有 ${D.snapshots||0} 筆快照。每個「星期 × 小時」格子要累積約 7 天才能判斷穩定的高峰時段，未滿的格子會顯示為空白。`
       : `樣本已足夠，熱力圖可直接判讀每週高峰時段。`}</div>`;
}

function heatmapHTML(hm, samples){
  let h = '<div class="grid"><div class="gl"></div>';
  for(let hr=0; hr<24; hr++) h += `<div class="hl">${hr%3===0?hr:""}</div>`;
  for(let wd=0; wd<7; wd++){
    h += `<div class="gl">${WD[wd].slice(1)}</div>`;
    for(let hr=0; hr<24; hr++){
      const v = hm && hm[wd] ? hm[wd][hr] : null;
      const n = samples && samples[wd] ? samples[wd][hr] : 0;
      const na = v==null ? " na" : "";
      const tip = v==null ? "資料累積中" : `${WD[wd]} ${hr}:00 平均使用率 ${pct(v)}（${n} 筆）`;
      h += `<div class="hc${na}" style="background:${col(v)}" title="${tip}"></div>`;
    }
  }
  h += "</div>";
  h += `<div class="legend"><span>空</span>
    <i style="background:${col(0)}"></i><i style="background:${col(.25)}"></i>
    <i style="background:${col(.5)}"></i><i style="background:${col(.75)}"></i>
    <i style="background:${col(1)}"></i><span>滿</span>
    <span style="margin-left:auto">灰格 = 待累積</span></div>`;
  return h;
}

function render(){
  const q = (document.getElementById("q").value||"").trim();
  const sort = document.getElementById("sort").value;
  let rows = rowsForMode().filter(r => !q || r.name.includes(q) || ((r.meta.address||"")).includes(q));

  if(tab===0){
    rows.sort((a,b)=>{
      if(sort==="name") return a.name.localeCompare(b.name,"zh");
      if(sort==="free") return (a.free??1e9)-(b.free??1e9);
      return (b.rate??-1)-(a.rate??-1);
    });
    document.getElementById("list").innerHTML = rows.length ? rows.map(r=>{
      const r8 = r.rate;
      return `<div class="cp" onclick="openSheet('${r.id}')">
        <div class="top"><div class="nm">${esc(r.name)}</div><div class="zn">${esc(r.zone)}</div></div>
        <div class="mid">
          <div class="num">剩 <b style="color:${colText(r8)}">${r.free==null?"-":r.free}</b> / ${r.cap==null?"-":r.cap}</div>
          <div class="track"><i style="width:${Math.round((r8||0)*100)}%;background:${colText(r8)}"></i></div>
          <div class="num" style="flex:0 0 auto;color:${colText(r8)}">${pct(r8)}</div>
        </div>
        <div class="ft"><span>${esc(mLabel())}位 ${nf(r.cap)} 個</span>
        <span>更新 ${esc((r.updated_at||"").slice(11,16)||"--:--")}</span></div>
      </div>`;
    }).join("") : `<div class="empty">找不到符合的停車場</div>`;
  } else {
    rows = rows.filter(r => r.peak);
    rows.sort((a,b)=> (b.peak?b.peak.rate:0) - (a.peak?a.peak.rate:0));
    const card = c => {
      const p = c.peak;
      return `<div class="pk" onclick="openSheet('${c.id}')">
        <div class="l"><div class="n">${esc(c.name)}</div>
          <div class="p">高峰 <b style="color:${colText(p.rate)}">${p.weekday_label} ${String(p.hour).padStart(2,"0")}:00</b>
          ${p.samples?`· ${p.samples} 筆樣本`:""}</div></div>
        <div class="r"><b style="color:${colText(p.rate)}">${pct(p.rate)}</b><span>使用率</span></div>
      </div>`;
    };
    const ao = allOver();
    const head = (!q && ao.peak) ? card(ao) : "";
    const body = rows.length ? rows.map(card).join("")
      : `<div class="empty">尚無足夠資料判斷${mLabel()}高峰時段<br><span style="font-size:12px">資料持續累積中</span></div>`;
    document.getElementById("plist").innerHTML =
      (head ? head + `<div style="height:1px;background:var(--line);margin:10px 2px"></div>` : "") + body;
  }
}

function openSheet(id){
  const c = id==="__all__" ? allOver() : modeRow((D.carparks||[]).find(x=>x.id===id) || {});
  if(!c || !Object.keys(c).length) return;
  const cur = c.cur_all||{}, capA = c.cap_all||{};

  const sub = id==="__all__"
    ? `全澳 ${nf(M().overall.carparks)} 個有${mLabel()}位的停車場 · 依車位數加權`
    : `${esc(c.zone)} · 更新 ${esc(c.updated_at||"--")}`;
  let h = `<h2>${esc(c.name)}</h2><div class="sz">${sub}</div>`;

  /* 主角：目前車種 */
  h += `<div class="slots">
    <div class="slot hero"><b style="color:${colText(c.rate)}">${c.free==null?"-":c.free}<small> / ${nf(c.cap)}</small></b>
      <span>${esc(mLabel())}剩餘車位 · 使用率 ${pct(c.rate)}</span></div>
  </div>`;

  /* 其他車種（次要資訊） */
  const others = [];
  if(mode!=="car"     && cur.car!=null)      others.push(["私家車", cur.car, capA.car]);
  if(mode!=="motor"   && cur.motor!=null)    others.push(["電單車", cur.motor, capA.motor]);
  if(cur.ev_car!=null)   others.push(["電動汽車", cur.ev_car, capA.ev_car]);
  if(cur.ev_motor!=null) others.push(["電動電單車", cur.ev_motor, capA.ev_motor]);
  if(cur.disabled!=null) others.push(["傷殘車位", cur.disabled, capA.disabled]);
  if(others.length){
    h += `<div class="sect">其他車位（即時）</div><div class="chips">${others.map(([l,f,t])=>
      `<span class="chip">${l} 剩 <b style="color:${colText(f!=null&&t?1-f/t:null)}">${f}</b>${t?` / ${t}`:""}</span>`).join("")}</div>`;
  }

  h += frame(`${esc(mLabel())}24 小時使用量曲線`,"平均使用率", lineChart(c.profile||[]));
  h += frame(`${esc(mLabel())}各星期平均使用率`,"", barChart(c.weekday_profile||[], WDS));

  if(c.peak){
    h += `<div class="hm"><div class="hm-hd"><b>每週使用高峰（${esc(mLabel())}）</b><span>${c.peak.samples} 筆樣本 @ 尖峰</span></div>
      ${heatmapHTML(c.heatmap, c.samples)}
      <div class="chips">${c.peak_top.map(p=>
        `<span class="chip">${p.weekday_label} ${String(p.hour).padStart(2,"0")}:00 <b style="color:${colText(p.rate)}">${pct(p.rate)}</b></span>`
      ).join("")}</div></div>`;
  } else {
    h += `<div class="hm"><div class="hm-hd"><b>每週使用高峰（${esc(mLabel())}）</b><span>資料累積中</span></div>
      <div class="empty" style="padding:20px 0">這個停車場還沒有足夠的歷史樣本</div></div>`;
  }

  if(id!=="__all__")
    h += `<button class="bigbtn" onclick="pinChart('${c.id}')">在上方圖表顯示這個停車場</button>`;

  const m = c.meta||{};
  h += `<div class="kv">
    ${m.address?`<div><em>位置</em><span>${esc(m.address)}</span></div>`:""}
    ${m.phone?`<div><em>電話</em><span>${esc(m.phone)}</span></div>`:""}
    ${m.height_limit_m?`<div><em>高度限制</em><span>${esc(m.height_limit_m)} 米</span></div>`:""}
    ${m.fee_light?`<div><em>輕型車收費</em><span>${esc(m.fee_light)}</span></div>`:""}
    ${m.fee_motor?`<div><em>電單車收費</em><span>${esc(m.fee_motor)}</span></div>`:""}
  </div>`;

  document.getElementById("sbody").innerHTML = h;
  document.getElementById("mask").classList.add("on");
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){
  document.getElementById("mask").classList.remove("on");
  document.getElementById("sheet").classList.remove("on");
}

renderModes();
overview();
renderHealth();
initSel(true);
renderCharts();
render();
setInterval(renderHealth, 60000);
</script>
