<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B0E14">
<title>澳門停車場 · 使用率地圖</title>
<style>
:root{
  --bg:#0B0E14; --card:rgba(20,26,36,.92); --card2:#1A2230; --line:#232E3E;
  --tx:#E6EDF3; --tx2:#9AA7B8; --tx3:#6B7889; --accent:#4C8DFF;
  --shadow:0 8px 28px rgba(0,0,0,.46);
  color-scheme:dark;   /* 讓原生 <select> 下拉也走深色 */
}
body.mode-motor{--accent:#F0A33C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--tx);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
}

/* ---------- map ---------- */
#map{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:#0B0E14}

/* ---------- HUD scaffolding ---------- */
.hud{position:fixed;z-index:20;pointer-events:none}
.hud > *{pointer-events:auto}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}

/* ---------- top bar ---------- */
#top{top:0;left:0;right:0;padding:10px 12px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
#topcard{width:100%;max-width:760px;padding:11px 13px 12px;transition:padding .18s}
#topcard.collapsed{padding:8px 12px}
.trow1{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.trow1 h1{
  margin:0;font-size:16.5px;font-weight:600;letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0
}
.chip{
  font-size:10.5px;color:var(--tx2);background:#1E2A3A;border-radius:20px;
  padding:2px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
  margin-left:auto;flex:0 0 auto
}
.chip i{width:6px;height:6px;border-radius:50%;background:#2EA043;display:none}
.chip.live i{display:block}
.chev{color:var(--tx3);font-size:13px;transition:.2s;flex:0 0 auto}
#topcard.collapsed .chev{transform:rotate(180deg)}
#topcard.collapsed #topbody{display:none}

.sub{margin-top:3px;font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--tx2);font-weight:500}
.backlink{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:600;
  color:var(--accent);text-decoration:none}
.backlink:hover{text-decoration:underline}

.segs{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:#0F1520;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--tx3);font:inherit;font-size:12px;font-weight:500;
  padding:6px 11px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap
}
.seg button:hover{color:var(--tx2)}
.seg button.on{background:var(--accent);color:#08101E;font-weight:600}
body.mode-motor .seg button.on{color:#1B1204}
.seg button.wd{padding:6px 8px;min-width:29px}
/* 即時模式下標出「今天是星期幾」，但用底線區隔，不要跟「已選取」的實心塊混淆 */
.seg button.now{color:var(--tx2);box-shadow:inset 0 -2px 0 rgba(154,167,184,.55)}
.seg .lab{font-size:10.5px;color:var(--tx3);align-self:center;padding:0 5px 0 7px;white-space:nowrap}
.sel{
  background:#0F1520;border:1px solid var(--line);border-radius:11px;color:var(--tx);
  font:inherit;font-size:12px;padding:6px 8px;cursor:pointer;outline:none
}
.sel:disabled{opacity:.45;cursor:default}

.stats{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.st{background:var(--card2);border-radius:9px;padding:6px 9px;min-width:0}
.st b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.2px;line-height:1.2}
.st span{font-size:10px;color:var(--tx3);white-space:nowrap}

/* ---------- legend ---------- */
#legend{left:12px;bottom:12px;max-width:min(300px,calc(100vw - 24px))}
#legcard{padding:9px 11px 10px}
.lg-hd{font-size:10.5px;color:var(--tx3);display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.lg-hd b{color:var(--tx2);font-weight:500}
.lg-bar{height:9px;border-radius:5px;background:linear-gradient(90deg,#2C7BE5,#1FB6C9,#35C46A,#D6C022,#F08A24,#F04438)}
.lg-lb{display:flex;justify-content:space-between;font-size:9.5px;color:var(--tx3);margin-top:3px}
.lg-ft{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:10px;color:var(--tx3);line-height:1.5}
.lg-ft i{font-style:normal;display:inline-block;border-radius:50%;background:#35C46A;vertical-align:middle;margin-right:4px}

/* ---------- zoom ---------- */
#zoom{right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);font-size:19px;line-height:1;cursor:pointer;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:0
}
#zoom button:active{background:var(--card2)}

/* ---------- bottom sheet ---------- */
#sheet{left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px}
#sheetcard{width:100%;max-width:760px;border-radius:16px 16px 0 0;overflow:hidden;display:flex;flex-direction:column}
.sheet-hd{
  display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;user-select:none;
  border-bottom:1px solid var(--line)
}
#sheetcard.collapsed .sheet-hd{border-bottom:0}
.sheet-hd b{font-size:13px;font-weight:600}
.sheet-hd span{font-size:10.5px;color:var(--tx3)}
.sheet-hd .chev{margin-left:auto;color:var(--tx3);transition:.2s;font-size:13px}
#sheetcard.collapsed .chev{transform:rotate(180deg)}
#sheetbody{max-height:31vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:7px 9px 12px}
#sheetcard.collapsed #sheetbody{display:none}
.cp{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;transition:.12s
}
.cp:hover,.cp.hl{background:var(--card2)}
.cp .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:0 0 0 2px rgba(255,255,255,.09)}
.cp .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .fr{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.cp .fr b{color:var(--tx2);font-weight:600}
.cp .bar{width:52px;height:5px;border-radius:3px;background:#1B2431;overflow:hidden;flex:0 0 52px}
.cp .bar i{display:block;height:100%;border-radius:3px}
.cp .rt{font-size:12px;font-weight:600;width:38px;text-align:right;flex:0 0 38px;letter-spacing:-.2px}

/* ---------- 推薦：搜尋列 ---------- */
#searchcard{width:100%;max-width:760px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;gap:7px;align-items:center}
#q{
  flex:1;min-width:0;border:1px solid var(--line);background:#0F1520;color:var(--tx);
  font:inherit;font-size:13px;padding:9px 11px;border-radius:10px;outline:none
}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--tx3)}
#qbtn{
  border:0;background:var(--accent);color:#08101E;font:inherit;font-size:12.5px;font-weight:600;
  padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap
}
#qbtn[disabled]{opacity:.45;cursor:default}
.shint{font-size:11px;color:var(--tx3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shint a{color:var(--accent);cursor:pointer;text-decoration:none}
.shint a:hover{text-decoration:underline}
.shint .orig{color:var(--tx2);font-weight:500}

/* ---------- 推薦：底部面板分頁 ---------- */
.tabs{display:flex;gap:2px;margin-left:auto;background:#0F1520;border:1px solid var(--line);border-radius:9px;padding:2px}
.tabs button{
  border:0;background:transparent;color:var(--tx3);font:inherit;font-size:11.5px;font-weight:500;
  padding:4px 10px;border-radius:7px;cursor:pointer;white-space:nowrap
}
.tabs button.on{background:var(--accent);color:#08101E;font-weight:600}

/* ---------- 推薦：結果列 ---------- */
.rc{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer;transition:.12s}
.rc:hover{background:var(--card2)}
.rc .rk{
  flex:0 0 20px;height:20px;border-radius:6px;background:#1E2A3A;color:var(--tx2);
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center
}
.rc.first .rk{background:var(--accent);color:#08101E}
.rc .bd{flex:1;min-width:0}
.rc .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .mt{font-size:10.5px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .rs{text-align:right;flex:0 0 auto}
.rc .rs b{font-size:14px;font-weight:600;letter-spacing:-.3px}
.rc .rs span{display:block;font-size:10px;color:var(--tx3)}
.cf{display:inline-block;border-radius:5px;padding:1px 5px;font-size:9.5px;margin-left:5px;vertical-align:1px}
.cf.hi{background:#16341F;color:#5FD98A}
.cf.mid{background:#3A3016;color:#E8C25A}
.cf.lo{background:#3A1F1F;color:#E88A8A}
.warn{margin:2px 8px 9px;padding:7px 9px;border-radius:9px;background:#3A3016;color:#E8C25A;font-size:11px;line-height:1.55}
.rnote{margin:0 8px 6px;font-size:11px;color:var(--tx3);line-height:1.5}

/* ---------- info window ---------- */
/* 高德自訂窗體（isCustom）沒有自帶外框，這裡自己畫，並補一個朝下的小箭頭。 */
.iw{min-width:196px;max-width:250px;background:#141A24;border:1px solid var(--line);
  border-radius:13px;padding:11px 12px 12px;color:var(--tx);box-shadow:0 10px 30px rgba(0,0,0,.6);
  position:relative}
.iw::after{
  content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;margin-left:-6px;
  background:#141A24;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  transform:rotate(45deg)
}
.iw .t{font-size:14px;font-weight:600;line-height:1.35;padding-right:14px}
.iw .g{font-size:10px;color:var(--tx3);margin-top:3px}
.iw .big{display:flex;align-items:baseline;gap:7px;margin-top:9px}
.iw .big b{font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1}
.iw .big small{font-size:11.5px;color:var(--tx3)}
.iw .track{height:7px;border-radius:4px;background:#1B2431;overflow:hidden;margin-top:8px}
.iw .track i{display:block;height:100%;border-radius:4px}
.iw .rows{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.iw .rows div{display:flex;gap:8px;font-size:11.5px}
.iw .rows em{font-style:normal;color:var(--tx3);flex:0 0 52px}
.iw .rows span{flex:1;color:var(--tx2);word-break:break-word}
.iw .chip{display:inline-block;background:#1E2A3A;border-radius:7px;padding:3px 7px;font-size:10.5px;color:var(--tx2);margin-top:8px}
.iw .chip b{color:var(--tx)}
.iw .hist{background:#22303F;color:#B9C7D8}

/* ---------- misc ---------- */
#fail{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:var(--bg);padding:24px;text-align:center;font-size:13px;color:var(--tx2);line-height:1.7
}
#fail b{display:block;color:var(--tx);font-size:15px;margin-bottom:8px}
#fail code{background:#1A2230;border-radius:5px;padding:1px 5px;font-size:12px;color:var(--tx2)}
/* 底部面板展開時，把圖例與縮放鈕推上去，否則會被面板蓋住 */
body.sheet-open #legend,
body.sheet-open #zoom{bottom:calc(31vh + 58px)}

@media (max-width:560px){
  #legend .lg-ft{display:none}
  .trow1 h1{font-size:15px}
  #sheetbody{max-height:29vh}
  .seg button{padding:6px 9px}
  .seg button.wd{padding:6px 6px;min-width:26px}
}
</style>

  window.__NEEDS_KEY__ = AMAP_KEY.indexOf('__AMAP') === 0;

<script type="text/javascript">

<body>

<div id="map"></div>

<div class="hud" id="top">
  <!-- 推薦功能的起點：地點 → 座標。打字走高德搜尋，點地圖則完全不耗額度。 -->
  <div class="panel" id="searchcard">
    <div class="srow">
      <input id="q" type="text" autocomplete="off" placeholder="輸入地點，例如：大三巴、氹仔碼頭">
      <button id="qbtn" type="button" disabled>查</button>
    </div>
    <div class="shint" id="qhint">輸入地點或直接<b>點地圖</b>選位置</div>
  </div>

  <div class="panel collapsed" id="topcard">
    <div class="trow1" id="tophd">
      <h1>澳門公共停車場 · 使用率地圖</h1>
      <span class="chip" id="slotchip">即時</span>
      <span class="chev">▾</span>
    </div>

    <div id="topbody">
      <div class="sub" id="asub">數據來源 交通事務局 DSAT · 每 30 分鐘自動採集</div>
      <a class="backlink" href="index.html">← 回實時車位列表</a>

      <div class="segs">
        <div class="seg" id="seg-when"><span class="lab">時段</span></div>
        <select class="sel" id="sel-hour" title="小時"></select>
      </div>

      <div class="segs">
        <div class="seg" id="seg-mode"><span class="lab">車種</span></div>
        <div class="seg" id="seg-layer"><span class="lab">顯示</span></div>
        <div class="seg" id="seg-crs"><span class="lab">座標</span></div>
      </div>

      <div class="stats">
        <div class="st"><b id="s-rate">--</b><span id="s-ratel">全澳使用率</span></div>
        <div class="st"><b id="s-free">--</b><span id="s-freel">剩餘車位</span></div>
        <div class="st"><b id="s-cap">--</b><span>總車位</span></div>
        <div class="st"><b id="s-cnt">--</b><span id="s-cntl">停車場數</span></div>
        <div class="st"><b id="s-full">--</b><span>≥90% 場數</span></div>
      </div>
    </div>
  </div>
</div>

<div class="hud" id="legend">
  <div class="panel" id="legcard">
    <div class="lg-hd"><b id="lg-title">使用率</b><span id="lg-note">越紅越滿</span></div>
    <div class="lg-bar"></div>
    <div class="lg-lb"><span>0% 空</span><span>50%</span><span>100% 滿</span></div>
    <div class="lg-ft"><i id="lg-dot"></i><span id="lg-fttx">圓點大小＝該場車位數</span></div>
  </div>
</div>

<div class="hud" id="zoom">
  <button type="button" id="zin" title="放大">+</button>
  <button type="button" id="zout" title="縮小">−</button>
  <button type="button" id="zfit" title="全澳" style="font-size:14px">◎</button>
</div>

<div class="hud" id="sheet">
  <div class="panel collapsed" id="sheetcard">
    <div class="sheet-hd" id="sheethd">
      <b id="sh-title">最擠的停車場</b>
      <span id="sh-sub"></span>
      <div class="tabs" id="shtabs">
        <button type="button" id="tab-rec">推薦</button>
        <button type="button" id="tab-busy" class="on">最擠</button>
      </div>
      <span class="chev">▾</span>
    </div>
    <div id="sheetbody"></div>
  </div>
</div>

var crs   = "gcj";      // gcj（高德底圖用的火星座標）| wgs（原始衛星座標）

/* 高德的熱力圖外掛（AMap.HeatMap）官方標示「暫時不支持移動端」，
   所以手機／平板預設只顯示圓點，並在圖例說明原因。 */
var IS_TOUCH = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||"");
if (IS_TOUCH) layer = "dot";

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var nf = function(n){ return (n==null||isNaN(n)) ? "--" : Number(n).toLocaleString("en-US"); };
var pct = function(r){ return (r==null||isNaN(r)) ? "--" : Math.round(r*100)+"%"; };
var pad2 = function(n){ return (n<10?"0":"") + n; };

/* ---- 色階：天氣圖式（藍＝空 → 紅＝滿），紅代表擠 ---- */
var STOPS = [[0,"#2C7BE5"],[0.25,"#1FB6C9"],[0.5,"#35C46A"],
             [0.7,"#D6C022"],[0.85,"#F08A24"],[1,"#F04438"]];
function h2r(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function ramp(r){
  if(r==null||isNaN(r)) return "#5C6879";
  r = r<0?0:(r>1?1:r);
  for(var i=1;i<STOPS.length;i++){
    if(r<=STOPS[i][0]){
      var a=STOPS[i-1], b=STOPS[i];
      var t=(r-a[0])/((b[0]-a[0])||1);
      var ca=h2r(a[1]), cb=h2r(b[1]);
      return "rgb("+Math.round(ca[0]+(cb[0]-ca[0])*t)+","+
                     Math.round(ca[1]+(cb[1]-ca[1])*t)+","+
                     Math.round(ca[2]+(cb[2]-ca[2])*t)+")";
    }
  }
  return STOPS[STOPS.length-1][1];
}
/* 高德的 gradient 用 rgb()/hex 皆可，這裡統一轉成 rgb() 字串。 */
var GRADIENT = {};
STOPS.forEach(function(s){
  var c = h2r(s[1]);
  GRADIENT[s[0]] = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
});

/* ---- 時段（星期 × 小時）---- */
/* WHEN === "live" 代表即時；否則 {wd:0-6, hr:0-23} 代表該時段的歷史平均。 */
var WHEN = "live";
var NOW = null;          // 澳門當下時段，開頁時算一次
function nowInTz(){
  try{
    var f = new Intl.DateTimeFormat("en-US",
      { timeZone: TZ, weekday: "short", hour: "2-digit", hour12: false });
    var o = {};
    f.formatToParts(new Date()).forEach(function(p){ o[p.type] = p.value; });
    var wd = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(o.weekday);
    var hr = parseInt(o.hour, 10) % 24;   // 有些實作午夜會回 "24"
    if(wd < 0 || isNaN(hr)) throw new Error("bad");
    return { wd: wd, hr: hr };
  }catch(e){
    var d = new Date();                    // 退路：用瀏覽器本地時間
    return { wd: (d.getDay() + 6) % 7, hr: d.getHours() };
  }
}
NOW = nowInTz();
function isLive(){ return WHEN === "live"; }
function slotIdx(){ return WHEN.wd * HRS + WHEN.hr; }
function slotLabel(){ return isLive() ? "即時" : (WD[WHEN.wd] + " " + pad2(WHEN.hr) + ":00"); }

/* 7x24 網格壓縮成字串：null → "."（1 字元），值 → 2 個 base-36 字元（0..100）。
   因為 "." 不是 base-36 字元，所以可以貪婪地逐段解析而不會歧義。 */
function decHeat(s){
  var out = [], i = 0, p = 0, n = s ? s.length : 0;
  while(p < n){
    if(s.charAt(p) === "."){ out[i++] = null; p += 1; }
    else { out[i++] = parseInt(s.substr(p, 2), 36) / 100; p += 2; }
  }
  return out;
}
function heatOf(p){
  if(p._h === undefined) p._h = p.hm ? decHeat(p.hm) : [];
  return p._h;
}

/* 目前要顯示的使用率：即時 → 快照值；歷史 → 該時段平均（可能沒有資料 = null） */
function curRate(p){
  if(isLive()) return (p.rate == null ? null : p.rate);
  var v = heatOf(p)[slotIdx()];
  return (v === undefined || v === null) ? null : v;
}
/* 歷史模式沒有真實剩餘車位，用 容量 ×(1-使用率) 估算 */
function curFree(p){
  if(isLive()) return p.free;
  var r = curRate(p);
  if(r == null || p.cap == null) return null;
  return Math.round(p.cap * (1 - r));
}
function hasSlot(p){ return curRate(p) != null; }

/* ================= 推薦：樣本數 / 距離 / 預測 ================= */

/* 樣本數網格（每格 1 字元）："." = 0 筆，"1".."7" = 實際筆數，"8" = 8 筆以上。
   編碼見 scripts/build_map.py 的 encode_samples。 */
function decSamples(s){
  var out = [], n = s ? s.length : 0;
  for(var i=0;i<n;i++){
    var c = s.charAt(i);
    out[i] = (c === "." ? 0 : parseInt(c, 10));
  }
  return out;
}
function samplesOf(p){
  if(p._s === undefined) p._s = p.sm ? decSamples(p.sm) : [];
  return p._s;
}

/* 信心等級。目前歷史只有幾天，大部分時段格子只有 1~3 筆樣本 ——
   必須老實標示，否則用戶會把「2 次觀察的平均」當成可靠預測。 */
function confOf(n){
  if(n >= 8) return {k:"hi",  t:"高信心", d:"8 次以上觀察"};
  if(n >= 4) return {k:"mid", t:"中信心", d:n + " 次觀察"};
  if(n >= 1) return {k:"lo",  t:"低信心", d:"只有 " + n + " 次觀察"};
  return null;
}

/* 兩點直線距離（公尺）。刻意自己算：高德的距離測量會耗「基礎LBS」額度，
   而 91 個停車場 × 每次查詢會即刻把額度燒光。 */
function hav(a, b){
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  var la1 = a[0] * rad, la2 = b[0] * rad;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

/* 目標時段（即時 = 現在）。 */
function targetWd(){ return isLive() ? (NOW ? NOW.wd : 0) : WHEN.wd; }
function targetHr(){ return isLive() ? (NOW ? NOW.hr : 0) : WHEN.hr; }

/* 該時段的預測使用率，附樣本數與來源。
   階梯式退路：該時段平均 → 該星期平均 → 全週平均 → 沒有資料。
   退路一定要標明，否則用戶會誤以為那是「該時段的實測值」。 */
function predict(p){
  var hm = heatOf(p), sm = samplesOf(p), i = targetWd() * HRS + targetHr();
  if(hm[i] != null) return { rate: hm[i], n: (sm[i] || 0), src: "slot" };

  var s = 0, c = 0, h, base = targetWd() * HRS;
  for(h = 0; h < HRS; h++){
    if(hm[base + h] != null){ s += hm[base + h]; c++; }
  }
  if(c) return { rate: s / c, n: 0, src: "weekday", cov: c };

  s = 0; c = 0;
  for(h = 0; h < hm.length; h++){
    if(hm[h] != null){ s += hm[h]; c++; }
  }
  if(c) return { rate: s / c, n: 0, src: "all", cov: c };
  return null;
}

/* 要排的是「有幾個空位」，不是「幾成滿」：
   1000 位 90% 滿仍然有 100 個位，50 位 90% 滿只剩 5 個。
   即時模式直接用實際剩餘數，比任何預測都準。 */
function predFree(p){
  if(isLive()) return (p.free == null ? null : { free: p.free, rate: p.rate, n: null, src: "live" });
  var r = predict(p);
  if(!r || p.cap == null) return null;
  return { free: Math.round(p.cap * (1 - r.rate)), rate: r.rate, n: r.n, src: r.src, cov: r.cov };
}

/* ---- 資料存取 ---- */
function M(){ return (D.modes||{})[mode] || null; }
function mLabel(){ var m=M(); return m ? (m.label||mode) : ""; }
var IDX = {};
function parkById(id){ return IDX[mode] ? IDX[mode][id] : null; }
function rebuildIndex(){
  IDX = {};
  Object.keys(D.modes||{}).forEach(function(k){
    var t = {};
    (D.modes[k].parks||[]).forEach(function(p){ t[p.id]=p; });
    IDX[k]=t;
  });
}
/* payload 裡的座標一律是 [lat, lng]；高德要的是 LngLat(lng, lat)，順序相反。 */
function pt(p){ return crs==="gcj" ? p.g : p.w; }
function ll(c){ return new AMap.LngLat(c[1], c[0]); }

/* ---- 地圖 ---- */
if(typeof AMap === "undefined"){
  var f = $("fail");
  if(window.__NEEDS_KEY__ && f.firstChild){
    f.firstChild.innerHTML = '<b>需要自備高德地圖 key</b>' +
      '本頁沒有內建金鑰。請到 <b>lbs.amap.com</b> 申請「Web端(JS API)」key 與安全密鑰，' +
      '寫入 <code>dashboard/.amap_key.json</code> 後重新執行 ' +
      '<code>scripts/build_map.py</code>；' +
      '或在 GitHub 專案設定加上 <code>AMAP_KEY</code> / <code>AMAP_SECURITY</code> 兩個 Secret。';
  }
  f.style.display = "flex";
  return;
}
var CENTER = D.center || [22.1875,113.5495];   // [lat, lng]
var MAPCENTER = [CENTER[1], CENTER[0]];        // 高德要 [lng, lat]

var map = new AMap.Map("map", {
  center: MAPCENTER,
  zoom: 13,
  viewMode: "2D",                    // 預設是 3D，這裡固定 2D
  mapStyle: "amap://styles/dark",    // 官方內建深色底圖（幻影黑），免申請自訂樣式
  zooms: [11, 19],                   // 注意：高德用 zooms:[min,max]，不是 minZoom/maxZoom
  resizeEnable: true
});

var heat = null, dots = null, iw = null;

function clearHeat(){ if(heat){ heat.setMap(null); heat = null; } }
function clearDot(){
  if(dots){ for(var i=0;i<dots.length;i++) dots[i].setMap(null); dots = null; }
}

function buildHeat(){
  clearHeat();
  if(layer==="dot") return;
  var m = M(); if(!m) return;
  var pts = [];
  (m.parks||[]).forEach(function(p){
    var r = curRate(p);
    if(r == null) return;              // 該時段沒有資料 → 不進熱力圖，免得畫出假的熱區
    var c = pt(p);
    pts.push({ lng: c[1], lat: c[0], count: Math.round(r*100) });
  });
  if(!pts.length) return;
  heat = new AMap.HeatMap(map, {
    radius: 62,            // 單位 pixel（官方預設 30）
    opacity: [0, 0.76],    // 注意：高德是「區間陣列」，不是單一數值
    gradient: GRADIENT,    // key 為 0~1 的間隔位置
    zooms: [11, 19],
    zIndex: 120,
    visible: true
  });
  heat.setDataSet({ data: pts, max: 100 });
}

function buildDot(){
  clearDot();
  if(layer==="heat") return;
  var m = M(); if(!m) return;
  dots = [];
  (m.parks||[]).forEach(function(p){
    var r = curRate(p);
    var c = pt(p);
    var cap = p.cap||0;
    /* 半徑用車位數開根號，避免大場把小場完全蓋住。CircleMarker 半徑單位是 px（上限 64）。 */
    var rad = Math.max(5, Math.min(17, 4.6 + Math.sqrt(Math.max(cap,0))*0.20));
    var cm = new AMap.CircleMarker({
      center: ll(c),
      radius: rad,
      strokeColor: "rgba(6,10,18,.62)",
      strokeWeight: 1,
      strokeOpacity: 1,
      /* 該時段沒有資料 → 中性灰。仍然看得到位置、也點得開，
         但不會被誤讀成「很空」（畫成 0% 藍色是錯的）。 */
      fillColor: (r == null ? "#39465A" : ramp(r)),
      fillOpacity: (r == null ? 0.55 : 0.85),
      zIndex: 120,
      cursor: "pointer"
    });
    (function(id, pos){
      cm.on("click", function(){
        lastMarkerClick = Date.now();     // 見 map.on("click") 的說明
        showInfo(id, pos, false);
      });
    })(p.id, ll(c));
    cm.setMap(map);
    dots.push(cm);
  });
}

/* ---- 資訊窗 ---- */
function infoHTML(p){
  var r = curRate(p), free = curFree(p), live = isLive();
  var h = '<div class="iw">';
  h += '<div class="t">' + esc(p.n) + '</div>';
  if(p.gov && p.gov !== p.n) h += '<div class="g">政府登記：' + esc(p.gov) + '</div>';
  h += '<div class="big"><b style="color:' + ramp(r) + '">' +
       (free==null ? "-" : nf(free)) + '</b>' +
       '<small>' + (live ? "剩餘" : "預估剩餘") + ' / ' + nf(p.cap) + ' 位</small>' +
       '<span style="margin-left:auto;font-size:15px;font-weight:600;color:' + ramp(r) + '">' + pct(r) + '</span></div>';
  h += '<div class="track"><i style="width:' + Math.round((r||0)*100) + '%;background:' + ramp(r) + '"></i></div>';
  h += '<div class="rows">';
  if(!live){
    h += '<div><em>時段</em><span>' + esc(slotLabel()) + ' 的歷史平均</span></div>';
  } else {
    if(p.occ!=null) h += '<div><em>使用中</em><span>' + nf(p.occ) + ' 位</span></div>';
  }
  if(p.pk!=null)  h += '<div><em>每週高峰</em><span>' + esc(p.pkw||"") + ' ' +
                        pad2(p.pkh==null?"":p.pkh) + ':00 · ' + pct(p.pk) + '</span></div>';
  if(p.addr)      h += '<div><em>位置</em><span>' + esc(p.addr) + '</span></div>';
  if(p.tel)       h += '<div><em>電話</em><span>' + esc(p.tel) + '</span></div>';
  h += '</div>';
  h += '<div class="chip' + (live ? '' : ' hist') + '">' +
       (live ? '' : esc(slotLabel()) + ' · ') +
       esc(mLabel()) + '車位 <b>' + nf(p.cap) + '</b> 個</div>';
  h += '</div>';
  return h;
}

function showInfo(id, pos, fly){
  var p = parkById(id);
  if(!p) return;
  if(!iw){
    iw = new AMap.InfoWindow({
      isCustom: true,                 // 自訂 HTML 窗體（外框與箭頭由 .iw 自己畫）
      offset: new AMap.Pixel(0, -12), // 相對 content 下緣中點的位移
      zIndex: 30
    });
  }
  iw.setContent(infoHTML(p));
  iw.open(map, pos);                  // 同一時間只會開一個窗體
  if(fly) map.setZoomAndCenter(Math.max(map.getZoom(), 15), pos, false, 520);
  highlight(id);
}

function highlight(id){
  var rows = $("sheetbody").querySelectorAll(".cp");
  for(var i=0;i<rows.length;i++) rows[i].classList.toggle("hl", rows[i].getAttribute("data-id")===id);
}

/* ---- HUD 內容 ---- */
function renderChip(){
  var c = $("slotchip");
  if(isLive()){
    c.className = "chip live";
    c.innerHTML = "<i></i>即時";
  } else {
    c.className = "chip";
    c.textContent = slotLabel();
  }
}

function renderWhen(){
  var sw = $("seg-when");
  sw.innerHTML = '<span class="lab">時段</span>';

  var b = document.createElement("button");
  b.type = "button"; b.textContent = "即時";
  if(isLive()) b.className = "on";
  b.onclick = function(){ setWhen("live"); };
  sw.appendChild(b);

  WD.forEach(function(label, i){
    var w = document.createElement("button");
    w.type = "button";
    w.textContent = label.replace(/^週/, "");
    var isToday = isLive() && NOW.wd === i;
    w.title = label + (isToday ? "（今天）" : "");
    w.className = "wd" + ((!isLive() && WHEN.wd === i) ? " on" : (isToday ? " now" : ""));
    w.onclick = function(){ setWhen({ wd: i, hr: isLive() ? NOW.hr : WHEN.hr }); };
    sw.appendChild(w);
  });

  var sel = $("sel-hour");
  sel.value = String(isLive() ? NOW.hr : WHEN.hr);
  sel.disabled = isLive();
}

function buildHourOptions(){
  var sel = $("sel-hour"), html = "";
  for(var h=0; h<HRS; h++) html += '<option value="' + h + '">' + pad2(h) + ':00</option>';
  sel.innerHTML = html;
  sel.onchange = function(){
    var h = parseInt(sel.value, 10);
    if(isNaN(h)) return;
    setWhen({ wd: isLive() ? NOW.wd : WHEN.wd, hr: h });
  };
}

function renderSegs(){
  var sm = $("seg-mode"), sl = $("seg-layer"), sc = $("seg-crs");
  sm.innerHTML = '<span class="lab">車種</span>';
  MODES.forEach(function(mid){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = (D.modes[mid].label||mid);
    if(mid===mode) b.className = "on";
    b.onclick = function(){ setMode(mid); };
    sm.appendChild(b);
  });
  var LAYERS = [["both","熱力＋圓點"],["heat","純熱力"],["dot","純圓點"]];
  sl.innerHTML = '<span class="lab">顯示</span>';
  LAYERS.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = o[1];
    if(o[0]===layer) b.className = "on";
    b.onclick = function(){ setLayer(o[0]); };
    sl.appendChild(b);
  });
  var CRSS = [["gcj","高德"],["wgs","衛星"]];
  sc.innerHTML = '<span class="lab">座標</span>';
  CRSS.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = o[1];
    if(o[0]===crs) b.className = "on";
    b.onclick = function(){ crs = o[0]; renderSegs(); rebuild(); closeInfo(); };
    sc.appendChild(b);
  });
}

function renderStats(){
  var m = M(); if(!m) return;
  var parks = m.parks||[];
  var live = isLive();
  var rate, free, cap, cnt, full = 0;

  if(live){
    rate = m.rate; free = m.free; cap = m.capacity; cnt = parks.length;
    parks.forEach(function(p){ if(p.rate!=null && p.rate>=0.9) full++; });
  } else {
    /* 歷史模式：只統計「該時段有資料」的場，容量加權平均 */
    var capSum = 0, freeSum = 0, cov = 0;
    parks.forEach(function(p){
      var r = curRate(p);
      if(r == null) return;
      cov++;
      capSum += (p.cap||0);
      freeSum += (p.cap||0) * (1 - r);
      if(r >= 0.9) full++;
    });
    rate = capSum ? (1 - freeSum/capSum) : null;
    free = capSum ? Math.round(freeSum) : null;
    cap = m.capacity; cnt = cov;
  }

  $("s-rate").textContent = pct(rate);
  $("s-rate").style.color = ramp(rate);
  $("s-ratel").textContent = live ? (mLabel() + "使用率") : (slotLabel() + " 平均");
  $("s-free").textContent = nf(free);
  $("s-freel").textContent = live ? "剩餘車位" : "預估剩餘";
  $("s-cap").textContent  = nf(cap);
  $("s-cnt").textContent  = nf(cnt);
  $("s-cntl").textContent = live ? "停車場數" : "有資料場數";
  $("s-full").textContent = nf(full);
  $("s-full").style.color = full ? "#F04438" : "var(--tx)";

  $("lg-title").textContent = live ? (mLabel() + "使用率") : (slotLabel() + " 平均使用率");
  $("lg-dot").style.background = ramp(rate);
  var ft = layer==="heat" ? "熱力強度＝該場使用率" : "圓點大小＝該場車位數";
  if(IS_TOUCH) ft += "（高德熱力圖暫不支援手機，建議用「純圓點」）";
  $("lg-fttx").textContent = ft;

  renderChip();
}

/* ================= 推薦：地點 → 篩選 → 排序 ================= */

var ORIGIN = null;        // {lat, lng, name, zone}
var SHEET_TAB = "busy";   // busy | rec
var RADII = [800, 1500, 3000];

function nearestPark(o){
  var parks = (M() || {}).parks || [], best = null, bd = Infinity;
  for(var i=0;i<parks.length;i++){
    var d = hav(o, pt(parks[i]));
    if(d < bd){ bd = d; best = parks[i]; }
  }
  return best;
}

/* 推薦的核心。澳門三條橋，直線距離跨得過海 —— 所以先用 zone 把
   「直線很近但係對岸」排除，再逐級放寬半徑，最後才允許跨區並警告。 */
function recommend(){
  if(!ORIGIN) return null;
  var m = M(); if(!m) return null;
  var o = [ORIGIN.lat, ORIGIN.lng];
  var ozone = ORIGIN.zone;
  if(!ozone){ var np = nearestPark(o); ozone = np ? (np.zone || "") : ""; }

  var all = [];
  (m.parks || []).forEach(function(p){
    var f = predFree(p);
    if(!f || f.free == null) return;
    all.push({ p: p, d: hav(o, pt(p)), free: f.free, rate: f.rate, n: f.n, src: f.src, cov: f.cov });
  });
  if(!all.length) return { list: [], zone: ozone };

  var sz = all.filter(function(x){ return (x.p.zone || "") === ozone; });
  for(var i=0;i<RADII.length;i++){
    var lim = RADII[i];
    var hit = sz.filter(function(x){ return x.d <= lim; });
    if(hit.length >= 3) return { list: hit, radius: lim, zone: ozone, cross: false };
  }
  if(sz.length) return { list: sz, radius: null, zone: ozone, cross: false };
  return { list: all, radius: null, zone: ozone, cross: true };
}

function recRow(x, i){
  var p = x.p, cf = (x.src === "live") ? null : confOf(x.n);
  var badge = cf ? '<span class="cf ' + cf.k + '" title="' + esc(cf.d) + '">' + cf.t + '</span>'
                 : (x.src === "live" ? '<span class="cf hi">即時</span>' : '<span class="cf lo">推算</span>');
  var src = x.src === "live"    ? "即時讀數"
          : x.src === "slot"    ? "該時段平均"
          : x.src === "weekday" ? "該時段無資料 → 用該星期平均"
                                : "該時段無資料 → 用全週平均";
  var dist = x.d < 1000 ? Math.round(x.d) + " m" : (x.d / 1000).toFixed(2) + " km";
  return '<div class="rc' + (i === 0 ? " first" : "") + '" data-id="' + esc(p.id) + '">' +
    '<span class="rk">' + (i + 1) + '</span>' +
    '<span class="bd">' +
      '<span class="nm">' + esc(p.n) + '</span>' +
      '<span class="mt">' + dist + ' · ' + src + badge + '</span>' +
    '</span>' +
    '<span class="rs"><b style="color:' + ramp(x.rate) + '">' + nf(x.free) + '</b><span>預估空位</span></span>' +
  '</div>';
}

function renderRec(){
  var body = $("sheetbody");
  if(!ORIGIN){
    body.innerHTML = '<div class="warn">先在上面輸入地點，或直接<b>點地圖</b>選一個位置。' +
      '系統會用該時段的歷史平均，算出附近最可能有空位的停車場。</div>';
    return;
  }
  var res = recommend();
  if(!res || !res.list.length){
    body.innerHTML = '<div class="warn">這個位置附近找不到有資料的停車場。</div>';
    return;
  }
  var list = res.list.slice().sort(function(a, b){ return b.free - a.free; }).slice(0, 5);

  var note;
  if(res.cross){
    note = '<div class="warn">' + esc(res.zone) + ' 沒有有資料的停車場，以下是跨區結果 —— ' +
           '澳門跨海要過橋，實際車程會比直線距離遠得多。</div>';
  } else if(res.radius){
    note = '<div class="rnote">' + esc(res.zone) + ' · ' + res.radius + ' 公尺內 ' +
           res.list.length + ' 個場，以下為預估空位最多的 5 個</div>';
  } else {
    note = '<div class="rnote">' + esc(res.zone) + ' · 3 公里內沒有場，已列出全區結果</div>';
  }
  body.innerHTML = note + list.map(recRow).join("");

  var rows = body.querySelectorAll(".rc");
  for(var i=0;i<rows.length;i++){
    (function(row){
      row.onclick = function(){
        var p = parkById(row.getAttribute("data-id"));
        if(p) showInfo(p.id, ll(pt(p)), true);
      };
    })(rows[i]);
  }
}

function renderSheet(){
  $("tab-rec").className  = (SHEET_TAB === "rec")  ? "on" : "";
  $("tab-busy").className = (SHEET_TAB === "busy") ? "on" : "";

  if(SHEET_TAB === "rec"){
    $("sh-title").textContent = "推薦停車場";
    $("sh-sub").textContent = ORIGIN ? (ORIGIN.name || "已選位置") : "未選位置";
    renderRec();
    return;
  }

  var m = M(); if(!m) return;
  var live = isLive();
  var parks = (m.parks||[]).filter(hasSlot).sort(function(a,b){
    return (curRate(b)||0) - (curRate(a)||0);
  });
  var shown = parks.slice(0, 40);
  $("sh-title").textContent = live ? "最擠的停車場" : (slotLabel() + " 最擠");
  $("sh-sub").textContent = shown.length + " / " + parks.length + " 場 · 由最擠排起";
  $("sheetbody").innerHTML = shown.map(function(p){
    var r = curRate(p), f = curFree(p);
    return '<div class="cp" data-id="' + esc(p.id) + '">' +
      '<span class="dot" style="background:' + ramp(r) + '"></span>' +
      '<span class="nm">' + esc(p.n) + '</span>' +
      '<span class="fr">' + (live ? "剩" : "估") + ' <b>' + (f==null?"-":f) + '</b>/' + (p.cap==null?"-":p.cap) + '</span>' +
      '<span class="bar"><i style="width:' + Math.round((r||0)*100) + '%;background:' + ramp(r) + '"></i></span>' +
      '<span class="rt" style="color:' + ramp(r) + '">' + pct(r) + '</span>' +
    '</div>';
  }).join("");
  var rows = $("sheetbody").querySelectorAll(".cp");
  for(var i=0;i<rows.length;i++){
    (function(row){
      row.onclick = function(){
        var id = row.getAttribute("data-id");
        var p = parkById(id); if(!p) return;
        showInfo(id, ll(pt(p)), true);
      };
    })(rows[i]);
  }
}

function renderHead(){
  var ts = (D.last_snapshot || D.generated_at || "--").slice(5,16);
  $("asub").innerHTML = '數據來源 交通事務局 DSAT · 每 30 分鐘自動採集 · ' +
    '<b>' + nf(D.snapshots) + '</b> 筆快照 / <b>' + nf(D.days_covered) + '</b> 天' +
    ' · 最後更新 ' + esc(ts);
}

function closeInfo(){ if(iw) iw.close(); }

/* 底部面板是否展開 —— 展開時圖例與縮放鈕要讓位 */
function sheetOpen(){ return !$("sheetcard").classList.contains("collapsed"); }

/* 切換圖層只做顯示／隱藏，不重建圖層（避免閃爍與多餘的 remove/add）。
   HeatMap 的 show/hide 並非所有版本都保證存在，所以做了退回處理。 */
function setHeatVisible(v){
  if(!heat) return;
  if(v){
    if(typeof heat.show === "function") heat.show(); else heat.setOptions({visible:true});
  } else {
    if(typeof heat.hide === "function") heat.hide(); else heat.setOptions({visible:false});
  }
}
function applyVisibility(){
  setHeatVisible(layer !== "dot");
  if(dots){
    var want = (layer !== "heat");
    for(var i=0;i<dots.length;i++) dots[i].setMap(want ? map : null);
  }
}

function rebuild(){
  /* body 的 class 用「重設」而不是「疊加」，所以要自己把 sheet-open 帶回去 */
  document.body.className = "mode-" + mode + (sheetOpen() ? " sheet-open" : "");
  buildHeat();
  buildDot();
  applyVisibility();
  renderStats();
  renderSheet();
}

function setMode(m){
  if(MODES.indexOf(m) < 0) return;
  mode = m; closeInfo();
  renderSegs(); rebuild();
}

function setLayer(l){
  if(l === layer) return;
  layer = l; closeInfo();
  renderSegs(); applyVisibility(); renderStats();
}

/* 時段切換：一律重建圖層，因為要換的是「資料」不是「可見度」 */
function setWhen(w){
  if(w === "live"){
    if(isLive()) return;
    WHEN = "live";
  } else {
    if(!isLive() && WHEN.wd === w.wd && WHEN.hr === w.hr) return;
    WHEN = { wd: w.wd, hr: w.hr };
  }
  closeInfo();
  renderWhen();
  rebuild();
}

/* ---- 事件 ---- */
$("zin").onclick  = function(){ map.setZoom(Math.min(19, map.getZoom()+1)); };
$("zout").onclick = function(){ map.setZoom(Math.max(11, map.getZoom()-1)); };
$("zfit").onclick = function(){
  closeInfo();
  map.setZoomAndCenter(13, MAPCENTER, false, 460);
};
$("sheethd").onclick = function(){
  $("sheetcard").classList.toggle("collapsed");
  document.body.classList.toggle("sheet-open", sheetOpen());
};
$("tophd").onclick   = function(){ $("topcard").classList.toggle("collapsed"); };

/* 推薦：搜尋框 */
$("q").addEventListener("input", function(){
  $("qbtn").disabled = $("q").value.trim().length < 2;
});
$("q").addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); doSearch($("q").value); }
});
$("qbtn").onclick = function(){ doSearch($("q").value); };

/* 分頁：按鈕在 sheethd 裡面，所以要阻止冒泡，否則會一併把面板收起 */
$("tab-rec").onclick  = function(e){ e.stopPropagation(); SHEET_TAB = "rec";  renderSheet(); };
$("tab-busy").onclick = function(e){ e.stopPropagation(); SHEET_TAB = "busy"; renderSheet(); };

/* 點地圖選位置。點停車場圓點時地圖的 click 也會觸發，
   所以用時間差把「剛剛點過標記」的情況濾掉。 */
map.on("click", function(e){
  if(Date.now() - lastMarkerClick < 400) return;
  var L = e.lnglat;
  setOrigin({ lat: L.lat, lng: L.lng, name: "地圖選點" });
});

/* ---- 推薦：地點輸入 ---- */
var omark = null;
var hitCache = {};        // 同一個關鍵字不重複打高德（省「基礎搜索」額度）
var lastMarkerClick = 0;  // 用來分辨「點地圖」與「點圓點」

function openSheet(){
  $("sheetcard").classList.remove("collapsed");
  document.body.classList.add("sheet-open");
}

function setOrigin(hit){
  ORIGIN = { lat: hit.lat, lng: hit.lng, name: hit.name || "" };
  var np = nearestPark([ORIGIN.lat, ORIGIN.lng]);
  ORIGIN.zone = np ? (np.zone || "") : "";

  if(!omark) omark = new AMap.Marker({ zIndex: 200 });
  omark.setPosition(new AMap.LngLat(ORIGIN.lng, ORIGIN.lat));
  omark.setMap(map);

  $("qhint").innerHTML = '位置：<span class="orig">' +
    esc(ORIGIN.name || (ORIGIN.lat.toFixed(4) + ", " + ORIGIN.lng.toFixed(4))) + '</span>' +
    ' · ' + esc(ORIGIN.zone || "未知區域") + ' · <a id="qclr">清除</a>';
  $("qclr").onclick = clearOrigin;

  SHEET_TAB = "rec";
  openSheet();
  renderSheet();
  map.setZoomAndCenter(Math.max(map.getZoom(), 15),
                       new AMap.LngLat(ORIGIN.lng, ORIGIN.lat), false, 420);
}

function clearOrigin(){
  ORIGIN = null;
  if(omark) omark.setMap(null);
  $("qhint").innerHTML = '輸入地點或直接<b>點地圖</b>選位置';
  SHEET_TAB = "busy";
  renderSheet();
}

function qbtn(busy, text){
  var b = $("qbtn");
  b.disabled = !!busy;
  b.textContent = text || "查";
}

/* 高德搜尋外掛是「按需要才載入」的：地圖本身完全不依賴它，
   所以就算外掛載入失敗（網路、key 權限），地圖仍然正常運作。 */
var PS = null, psLoading = false, psQueue = [];

function ensureSearch(cb){
  if(PS){ cb(true); return; }
  psQueue.push(cb);
  if(psLoading) return;
  psLoading = true;
  var done = false;
  var settle = function(ok){
    if(done) return;
    done = true;
    psLoading = false;
    var q = psQueue; psQueue = [];
    q.forEach(function(f){ f(ok); });
  };
  setTimeout(function(){ settle(!!PS); }, 9000);   // 逾時就放棄，不要卡住 UI
  if(typeof AMap.plugin !== "function"){ settle(false); return; }
  try{
    AMap.plugin(["AMap.PlaceSearch"], function(){
      try{
        /* city 用澳門 adcode；citylimit:false 讓它不會因為行政區邊界而漏掉結果 */
        PS = new AMap.PlaceSearch({ city: "820000", citylimit: false, pageSize: 8, extensions: "base" });
        settle(true);
      }catch(e){ settle(false); }
    });
  }catch(e){ settle(false); }
}

function showHits(list){
  SHEET_TAB = "rec";
  openSheet();
  $("tab-rec").className = "on";
  $("tab-busy").className = "";
  $("sh-title").textContent = "選擇地點";
  $("sh-sub").textContent = list.length + " 個符合";
  $("sheetbody").innerHTML = list.map(function(h, i){
    return '<div class="rc" data-i="' + i + '">' +
      '<span class="rk">' + (i + 1) + '</span>' +
      '<span class="bd"><span class="nm">' + esc(h.name) + '</span>' +
      '<span class="mt">' + esc(h.addr || "") + '</span></span></div>';
  }).join("");
  var rows = $("sheetbody").querySelectorAll(".rc");
  for(var i=0;i<rows.length;i++){
    (function(row){
      row.onclick = function(){ setOrigin(list[+row.getAttribute("data-i")]); };
    })(rows[i]);
  }
}

/* 高德的搜索外掛「剛載入完」不等於「可以用了」：內部的授權握手
   （FlyDataAuthTask）是非同步的，握手還沒完成時送出的第一個請求會直接
   error 或一直不回來。實測：同一頁面在 plugin 載入後立刻搜尋會失敗，
   隔幾秒後同樣的關鍵字 6/6 成功。
   所以 (1) 給請求加逾時，避免「查詢中…」永遠卡住；
        (2) error／逾時自動重試一次，救回冷啟動。
   兩次都失敗才報錯 —— 不隱藏真正的故障。
   測試用的加速鉤子見 scripts/test_map.js；正式環境 window.__AMAP_TEST__ 不存在。 */
var _T = window.__AMAP_TEST__ || null;
var SEARCH_TIMEOUT = (_T && _T.timeout) || 12000;
var RETRY_DELAY    = (_T && _T.retry)   || 1200;

function runSearch(kw, attempt){
  var settled = false;
  var timer = setTimeout(function(){
    if(settled) return;
    settled = true;
    if(attempt < 1) retry(); else fail("");
  }, SEARCH_TIMEOUT);

  function retry(){
    setTimeout(function(){ runSearch(kw, attempt + 1); }, RETRY_DELAY);
  }
  function fail(info){
    qbtn(false);
    $("qhint").innerHTML = '搜尋服務無法使用' +
      (info ? '（' + esc(info) + '）' : '') +
      ' · 請直接<b>點地圖</b>選位置（地圖與推薦不受影響）';
  }

  PS.search(kw, function(status, result){
    if(settled) return;              // 逾時已處理過，這個回呼就丟掉
    settled = true;
    clearTimeout(timer);

    /* status 有三種：complete（有結果）/ no_data（查無結果）/
       error（服務本身出錯 —— 例如 INVALID_USER_DOMAIN 域名白名單不符、
       額度用完、網路問題）。error 一定要跟「查無結果」分開講，
       否則用戶會以為係自己打錯字。 */
    if(status === "error"){
      if(attempt < 1){ retry(); return; }   // 先重試一次再報錯
      fail((result && result.info) || "");
      return;
    }
    qbtn(false);
    var pois = (status === "complete" && result && result.poiList && result.poiList.pois) || [];
    if(!pois.length){
      $("qhint").innerHTML = '找不到「' + esc(kw) + '」 · 換個關鍵字或<b>點地圖</b>選位置';
      return;
    }
    var hits = pois.map(function(p){
      var L = p.location;   // AMap.LngLat
      return { lat: L.lat, lng: L.lng, name: p.name, addr: p.address };
    });
    hitCache[kw] = hits;
    if(hits.length === 1) setOrigin(hits[0]);
    else showHits(hits);     // 多個符合 → 讓用戶自己揀，不要擅自揀第一個
  });
}

function doSearch(kw){
  kw = (kw || "").trim();
  if(kw.length < 2) return;
  if(hitCache[kw]){ setOrigin(hitCache[kw][0]); return; }

  qbtn(true, "查詢中…");
  ensureSearch(function(ok){
    if(!ok){
      qbtn(false);
      $("qhint").innerHTML = '搜尋服務載入失敗（可能是 key 權限或網路），請直接<b>點地圖</b>選位置';
      return;
    }
    runSearch(kw, 0);
  });
}

/* ---- 啟動 ---- */
rebuildIndex();
buildHourOptions();
renderSegs();
renderWhen();
renderHead();
rebuild();

})();
</script>
